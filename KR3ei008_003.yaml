body:
  text: 卷三産後門人問曰産後症諸家議論不一治法互異而吾閩歷久相傳俱宗朱丹溪所云産後有病先固氣血故産後以大補氣血為主雖有雜病以末治之薛立齋汪石山極贊其妙而陳良甫單養賢諸論皆不出其範圍虞天民葉以潛又以去瘀血為主二説互參可以得攻補兩大法究竟當從與否曰此皆庸俗之見亦且一偏之言不足聽也今節録內經二條金匱産後全册以注之各家之説一概置之弗言所謂群言淆亂衷於聖是也內經云乳子之時而患傷寒病熱脈止宜懸小不宜實大以産後新虛故也手足溫則生若脈雖懸小而見手足俱寒是脾氣衰絶陰氣暴起則死又云乳子中風而身為大熱以至喘鳴息粗者為風熱逆於陽位也故其脈必不能懸小而實大但須實大之中而見往來而和緩是脾胃之氣尚榮於脈則生設見疾急則脾胃已絶必死此二節以脾胃為主可知內經所獨重彼諸家互相辨駁終不足言也昔人云片語會心非是少即讀書得間之謂也門人問曰金匱較傷寒論更為難讀夫子於産後獨主之曷故曰醫儒者事也先其事之所難東魯明訓而因陋就簡直市醫耳且隨症條分各目臚列方治不得其頭緒如治絲而棼之也今舉金匱為主若得其一知半解便足活人故全録於下嘗論歷代未立考試醫生之制其失業之輩混充之以為糊口之術所以日流日下而女科其尤甚者若明理之人遇醫輩先詢之曰岐黃後若仲景可稱上醫否不知者曰我不知其為何人也其知者曰漢代之醫聖相去久遠而難從耳夫時有古今之異豈天之五運六氣入之五臟六腑亦有顛倒變遷之異乎知與不知不過以五十步笑百步耳設有明理者楷録此册第一節第二節原文今時行之醫每句淺淺講得下則是上好名醫即一時講不下肯執所録原文攜回查對各本舊注略能敷衍講得去便知渠家亦藏有正書必不至有大支離處亦是好醫或攜其原文轉向心腹之醫友處東摸西捉約略於皮毛土説得來便知渠門尚有一二讀書好友亦不至有大荒唐處亦是好醫余欲求其數種人不能旦暮遇之實為憾事且可聞其自文曰彼是仲景派我是劉張朱李前四大家派我是王肯堂薛立齋張景嶽喻嘉言後四大家派且時行臨症指南其藥慣用生薑滓泡淡附子地黃炭泡淡吳萸漂淡白朮及一切藥炭海中各種干殼皆無氣無味之類其治法開口便云五行三合雙山顛倒化合之妙皆渺茫無據之説虛病則云以人補人多仗紫河車熬膏此物大穢大毒大動火每見百服百死病人宜存好心行好事切勿聽此忍心害理之言久病則云入絡以老絲瓜鮮竹茹當歸鬚忍冬藤刺蒺藜之類為祕藥又以西瓜翠皮鮮荷梗淡菜肉海參之類為新奇不能於指南中擇其善而從之而惟集其所短天士有知當必斥之譴之而必張大其説曰我是葉天士一派斯言也彼妄言之我妄聽之其為斯道何哉所望行道諸君子速迸去相沿之病從事於聖經賢訓亦不失為善改過之君子矣金匱云問曰新産婦人有三病一曰病痙二曰病鬱冒三曰大便難何謂也師曰新産之婦畏其無汗若其無汗則榮衛不相和而為發熱無汗等症似乎傷寒之表病但舌頭無白苔及無頭痛項強之可辨也然而雖欲有汗又恐其血虛氣熱熱則腠理開而多汗出汗出則腠理愈開而喜中風血不養筋而風又動火故令病痙新産之婦畏血不行若不行則血瘀於內而為發熱腹痛等症似乎傷寒之裡病但舌無黃苔及無大煩燥大狂渴之可辨也然雖欲血下又恐過多而亡血血亡其氣無耦而外泄則復汗血氣兩耗則寒自內生而寒多血為陰陰亡失守氣為陽陽虛上厥故令頭眩目瞀或不省人事而鬱冒新産之婦雖欲其汗出血行又恐汗與血過多以致亡津液胃干腸燥故大便難三者不同其為亡血傷津則一也此為産後提出三病以為綱非謂産後止此三病也上言新産之病其提綱有三然痙病有竹葉湯之治法另詳於後試先言鬱冒與大便難相兼之症産婦鬱冒與大便難二病皆因亡血傷津所致故其脈俱見微弱惟嘔而不能食大便反堅是為大便難綱中之兼症一身無汗但頭上汗出為鬱冒綱中之專症所以然者血虛則陰竭於下而為下厥下厥則孤陽上越而必冒推而言之凡素患鬱冒之人名曰冒家吾觀其之冒家欲解必令大汗出而始解以血虛為下厥下厥則孤陽無依而上出故頭汗出此頭汗出為鬱冒病綱中之大眼目也所以産婦頭汗既出又喜其通身汗出者以亡陰血虛陽氣獨盛故當損陽令其汗出損陽就陰則陰陽乃平而復蓋陰陽之樞操自少陽非小柴胡湯不能轉其樞而使之平至於産後大便難之綱中其症俱便燥而且堅由於血行過多則陽明之血海乾枯而血不濡於下不濡於下則反逆於上而為嘔失和於中而為不能食陽明屬胃為血海血不自生生於所納之水穀人但知消導為平胃轉胃降逆順氣為安胃甘寒柔潤為補胃而不知小柴胡湯為和胃深一層治法與傷寒小柴胡湯方後云上焦得通津液得下胃氣因和三句移來此一節堪為此症之鐵板注腳也故以上二症而統以小柴胡湯主之此為鬱冒與大便難之相兼者詳其病因而出其方治也鬱冒之病既解而能食至七八日更發熱者然發熱而不惡寒便知其不在表而在裡矣因能食而更發熱便知其非虛病而為食復症矣此為胃實大承氣湯主之此言大虛之後有實症即當以實治之也若畏承氣之峻而不敢用恐因循致虛病變百出甚矣哉庸庸者不足以共事也若畏承氣之峻而用穀芽麥芽山楂神麯之類消耗胃氣亦為害事産後屬虛客寒阻滯血氣則腹中㽱痛以當歸生薑羊肉湯主之並治腹中寒疝虛勞不足參各家説㽱痛者緩緩痛也概屬客寒相阻故以當歸通血分之滯生薑行氣分之寒然胎前責實故當歸白朮散內加茯苓澤瀉瀉其水濕此屬産後大概責虛故以當歸養血而行血滯生薑散寒而行氣滯又主以羊肉味厚溫補氣而生血俾氣血得溫則邪自散而痛止矣此方攻補兼施故並治寒疝虛損或疑羊肉太補而不知孫真人謂羊肉止痛利産婦古訓鑿鑿可據又奚疑哉然痛亦有不屬於虛者不可不知産後腹痛若不煩不滿為中虛而寒動也今則火上逆而煩氣壅滯而滿胃不和而不得臥此熱下鬱而礙上也以枳實芍藥散主之此為腹痛而煩滿不得臥者出其方治也方意是調和氣血之滯所謂通則不痛之輕劑也下以大麥粥者並和其肝氣而養其心脾故癰膿亦主之師曰産婦腹痛法當以枳實芍藥散假令不愈者此為熱灼血腹中有乾血其痛著於臍下非枳實等藥所能治也宜下瘀血湯主之亦主經水不利此為痛著臍下出其方治也意者病去則虛自回不必疑其過峻然亦有不可專下其瘀血者不可不知産後七八日無頭痛發熱惡寒之太陽症少腹堅痛此惡露不盡治者不過下其瘀血而已然其不大便煩躁發熱切脈微實是胃家之實也陽明旺於申酉戌日晡是陽明向旺之時也而其再倍發熱至日晡時煩躁者又胃熱之驗也食入於胃長氣於陽若不食則已而食入則助胃之熱為譫語又胃熱之驗也然又有最確之辨晝陽也夜陰也若病果在陰宜晝輕而夜重今至夜間應陽明氣衰之時而即稍愈其為胃家之實熱更無疑也大承氣湯主之蓋此湯熱與結兼祛以陽明之熱在裡少腹之結在膀胱也此言血雖結於少腹若胃有實熱當以大承氣湯主之若但治其血而遺其胃則血雖去而熱不除即血亦未必能去也此條至夜則愈四字為辨症大眼目蓋晝為陽而主氣暮為陰而主血觀上節婦人傷寒發熱經水適來晝日明瞭暮則譫語如見鬼狀者此為熱入血室以此數語而對面尋繹之便知至夜則愈知其病不專在血也産後中風續續數十日不解似不應在桂枝症之例矣然頭微痛惡寒時時有熱皆桂枝本症中惟有心下悶一症邪入胸膈為太陽之裡症其餘乾嘔汗出俱為桂枝症例中本有之症是桂枝症更進一層即為陽旦症桂枝湯稍為增加即為陽旦湯其病雖久而陽旦症續在者可與陽旦湯張石頑云舉此與上文承氣湯為一表一里之對子不以日數之多而疑其表症也男元犀按此言産後陽旦症未罷病雖久而仍用其方也傷寒論太陽篇有因加附子參其間增桂令汗出之句言因者承上文病症象桂枝因取桂枝之原方也言增桂者即於桂枝湯原方外更增桂枝二兩合共五兩是也孫真人於此數句未能體認反以桂枝湯加黃芩為陽旦湯後人因之至今相沿不解甚矣讀書之難也然此方傷寒論特筆用令汗出三字大是眼目其與桂枝加附子之治遂漏者為同中之異而亦異中之同蓋止汗漏者匡正之功令汗出者驅邪之力泛應曲當方之所以入神也上節裡熱成實雖産後七八日與大承氣湯而不傷於峻此節表邪不解雖數十日之久與陽旦湯而不虛其數此中之奧妙難與淺人道也丹溪謂産後惟大補氣血為主其餘以末治之又云芍藥伐生生之氣此授庸醫藏拙之術以誤人不得不直斥之長孫心典稟按頭疼惡寒時時有熱自汗乾嘔俱是桂枝症而不用桂枝湯者以心下悶當用桂枝去芍藥湯之法今因産後亡血不可徑去芍藥須當增桂以宣其陽汗出至數十日之久雖與發汗遂漏者迥別亦當借桂枝加附子湯主法固少陰之根以止汗且止汗即在發汗之中此所以陽旦湯為絲絲入扣也前以痙病為産後三大綱之一然痙病本起於中風今以中風將變痙病而言之産後中風發熱面正赤喘而頭痛此病在太陽連及陽明而産後正氣太虛又不能以勝邪氣誠恐變為痙病以竹葉湯主之此為産後中風正虛邪盛者而出其補正散邪之方也方中以竹葉為君者以風為陽邪不解即變為熱熱盛則灼筋而成痙故以溫散藥中先君以竹葉而折其勢即杜漸防微之道也太陽之脈上行至頭陽明脈過膈上循於面二經合病多加葛根婦人乳中虛煩亂嘔逆安中益氣竹皮大丸主之徐忠可云乳者乳子之婦也言乳汁去多則陰血不足而胃中亦虛內經云陰者中之守也陰虛不能勝陽而火上壅則煩氣上越則嘔煩而亂則煩之甚也嘔而逆則嘔之甚也病本全由中虛然而藥止用竹茹桂甘石膏白薇者蓋中虛而至為嘔為煩則膽腑受邪煩嘔為主病故以竹茹之除煩止嘔者為君胸中陽氣不用故以桂甘扶陽而化其逆氣者為臣以石膏涼上焦氣分之虛熱為佐以白薇去表間之浮熱為使要知煩亂嘔逆而無腸痛下痢等證雖虛無寒可知也妙在加桂於涼劑中尤妙在生甘草獨多意謂散蘊蓄之邪復清陽之氣中即自安氣即自益故無一補劑而又注其立湯之本意曰安中益氣竹皮大丸神哉喘加柏實柏每西向得西方之氣最深故能益金氣潤肝木而養心則肺不受爍喘自平也有熱倍白薇蓋白薇能去浮熱故小品桂枝加龍骨牡蠣湯云汗多熱浮者去桂加白薇附子各三分名曰二加龍骨湯則白薇之能去浮熱可知矣凡下痢病多由濕熱白頭翁之苦以勝濕寒以除熱固其宣也而産後下痢虛極似不可不商及補劑但參術則恐其壅滯苓澤則恐其傷液惟以白頭翁加甘草阿膠湯主之誠為對症方中甘草之甘涼清中即所以補中阿膠之滋潤去風即所以和血以此治利即以此為大補彼治利而好用參術者當知所返矣此為産後下痢虛極者而出其方治也金匱附方云千金三物黃芩湯治婦人未離産所尚在於草蓐自發去衣被露其身體而得微風亡血之後陽邪客入則四肢苦煩熱然此症當其頭痛之與不痛若頭痛者是風未全變為熱與小柴胡湯以解之若頭不痛但煩者則已全變為熱熱盛則蟲生勢所必至以此湯主之長孫心典稟按附方者金匱本書闕載而千金外臺等書載之其云出自金匱後人別之曰附方附方千金內補當歸建中湯治婦人産後虛羸不足腹中刺痛不止吸吸少氣或苦少腹中急摩痛引腰背不能食飲産後一月日得服四五劑為善令人強壯宜徐忠可云産後虛羸不足先因陰虛後並陽虛補陰則寒凝補陽則氣壅蓋後天以中氣為主故治法亦出於建中但加當歸即偏於內故曰內補當歸建中湯謂腹中刺痛不止血少也吸吸少氣陽弱也故將桂枝生薑當歸之辛溫以行其榮衛之氣甘草白芍以養其脾陰之血而以飴糖大棗峻補中氣則元氣自復而羸者豐痛者止也然桂枝於陰陽內外無所不通猶恃當歸善入陰分治帶下之病故又主少腹急摩痛引腰背不能飲食者蓋帶下病去而中氣自強也曰産後一月日得服四五劑為善謂宜急於此調之庶無後時之嘆然藥味和平可以治疾可以調補故又曰令人強壯宜其云大虛加飴糖以虛極無可支撑惟大甘專於補脾脾為五臟六腑之母止此一條可以得其生路也其去血過多崩傷內衄方加乾地黃阿膠以其所傷原偏於陰故特多加陰藥非産後必宜用地黃阿膠也金匱方論一十一首小柴胡湯大承氣湯俱見傷寒論當歸生薑羊肉湯當歸三兩生薑五兩羊肉一斤上三味以水八升煮取三升溫服七合日三服若寒多加生薑成一斤痛多而嘔者加橘皮二兩白朮一兩加生薑者亦如水五升煮取三升二合服之歌曰腹痛脅疼腹脅皆寒氣作主無復界限里急不堪是內之榮血不足致陰氣不能相榮而急羊斤薑五蜀歸三於今豆蔻香砂法可笑醫盲授指南次男元犀按方中當歸行血分之滯而定痛生薑宣氣分之滯而定痛亦人所易曉也妙在羊肉之多羊肉為氣血有情之物氣味腥羶濃厚入咽之後即與濁陰混為一家旋而得當歸之活血而血中之滯通生薑之利氣而氣中之滯通通則不痛而寒氣無有潛藏之地所謂發透之而後攻之者也苟病家以羊肉太補而疑之是為流俗之説所囿其中蓋有命焉知幾者即當婉辭而去枳實芍藥散枳實炒令黑勿太過芍藥等分上二味杵為散服方寸匕日三服並主癰膿大麥粥下之歌曰滿煩不臥腹疼頻枳實微燒芍等平羊肉湯方應反看彼治不煩不滿之虛痛此治煩滿之實痛散調大麥粥穩而新長男蔚按枳實通氣滯芍藥通血滯通則不痛人所共知也妙在枳實燒黑得火化而善攻停積下以大麥粥和肝氣而兼養心脾是行滯中而寓補養之意故癰膿亦主之下瘀血湯大黃三兩桃仁二十個蟅蟲二十枚去足熬上三味末之煉蜜和為四丸以酒一斤煮一丸取八合頓服之瘀血下如豚肝各本略異歌曰臍中著痛瘀為殃草粒桃仁三兩黃更有蟅蟲二十個酒煎大下亦何傷次男元犀按産婦腹痛服枳實芍藥而不愈者為熱灼血乾而為停瘀其痛著於臍下宜用此湯方中大黃桃仁之推陳下瘀蟅蟲之善攻乾血人盡知之妙在桃仁一味平平中大有功力蓋血已敗而成瘀非得生氣不能流通桃得三月春和之氣而花最鮮明似血而其生氣皆在於仁而味苦又能開泄故直入血中而和之散之逐其舊而不傷其新也陽旦湯即桂枝湯倍桂增附坊本謂加黃芩者未知傷寒論太陽篇中已明其方也孫真人及各傢俱誤桂枝湯見傷寒論竹葉湯竹葉一把葛根三兩防風桔梗桂枝人參甘草各一兩附子一枚炮生薑五兩大棗十五枚劈上十味以水一斗煎服二升半分溫三服溫復取微汗頭項強用大附子一枚破之如豆大煎藥揚去沫嘔者加半夏半升洗歌曰喘熱頭疼面正紅勢欲成痙一兩防桔桂草人參同同用一兩葛根三兩生薑五兩附枚一棗十五枚竹葉一把充加減歌曰頭項強者大附抵以大易小不同體若為氣逆更議加半夏半升七次洗程云來云症中未至背反張而發熱面赤頭痛亦風痙之漸故用竹葉主風痙防風治內痙葛根療剛痙桂枝治柔痙生薑散風邪桔梗除風痹辛以散之之劑也又佐人參生液以養筋附子補火以致水合之甘草以和諸藥大棗以助十二經同諸風濟則發中有補為産後中風之大劑也竹皮大丸生竹茹石膏各二分桂枝一分白薇一分甘草七分上五味末之棗肉和丸彈子大飲服一丸日三夜二服有熱倍白薇煩喘者加柏實一分歌曰嘔而煩亂乳中虛謂乳子之時氣虛火勝內亂而上逆也二分石膏與竹茹薇桂一分加草七分棗丸飲服效徐徐加減歌曰白薇退熱絶神異有熱倍加君須記柏得金氣厚且深葉葉西向歸本位實中之仁又鎮心煩喘可加一分餌解見本論白頭翁加甘草阿膠湯湯見傷寒論再加甘草阿膠各二兩是也師云産後下利虛極者此主之歌曰白頭湯已見前歌二兩阿膠甘草和産後利虛成極症滋阿膠救其陰而且緩甘草緩其急莫輕過次男元犀按凡産後去血過多又兼下利亡其津液且為陰虛無疑茲云虛極理宜大補然歸芎芍地則益其滑而下脫參朮桂耆則動其陽而上逆皆為禁劑須知此虛字指陰虛而言與少陰症陰氣欲絶同義少陰症與大承氣湯急下以救陰與此症與白頭翁湯大苦以救陰同義此法非薛立齋張景嶽李士材輩以甘溫為主苦寒為戒者所可窺測尤妙在加甘草之甘合四味之苦為苦甘化陰法且久痢膏脂盡脫脈絡空虛得阿膠之滋潤合四味之苦以堅之則源流俱清而痢自止千金三黃散黃芩一兩苦參二兩乾地黃四兩上三味以水六升煮取二升溫服一升多利下蟲千金內補當歸建中湯當歸四兩桂枝生薑各三兩芍藥六兩甘草二兩大棗十二枚上六味以水一斗煮取三升分溫三服一日令盡若大虛加飴糖六兩湯成納之於火上暖令飴消若去血過多崩傷內衄不止加地黃六兩阿膠二兩合八味湯成納阿膠若無當歸以川芎代之若無生薑以乾薑代之門人問曰金匱外尚有可行之法否曰若能熟讀而得其精微任産後之病變百出無難一舉而安之若逐症而分治之即千百方尚有遺漏如嵩崖尊生東醫寶鑑臚列可謂詳矣試問能愈一症否乎然而鍾期老矣古調獨彈奚為乎不得已而從俗尚遂於坊刻各種擇出二十三種雖云淺率卻不離經亦姑録之於下王叔和曰産後脈寸口洪疾不調者死沉微附骨不絶者生又曰沉小滑者生實大堅弦急者死朱丹溪曰胎前脈當洪數既産而脈仍洪數者死又曰胎前脈細小産後脈洪大者多死濟生産經曰胎前之病其脈貴實産後之病其脈貴虛胎前則順氣安胎産後則扶虛消瘀此其要也脈要曰欲産之脈必見離經或沉細而滑夜半覺痛來朝日中必娩新産之脈緩滑為吉若實大弦急近乎無胃凶危之候或寸口澀疾不調惡症立見惟宜沉細附骨不絶雖劇無恙大全曰産後飲熱童便一盞不得便臥宜閉目而坐須臾上床宜仰臥不宜側坐宜豎膝不宜伸足高倚床頭厚鋪被褥遮圍四壁使無孔隙免致賊風以醋熏鼻或用醋炭更燒漆器頻以手從心擀至臍下以防血暈血逆如此三日不問腹痛不痛以童便和酒服五七次酒雖行血亦不可多恐引血入四肢能令血暈宜頻食白粥漸食羊肉豬蹄少許仍慎言語七情寒暑梳頭洗足以百日為度若氣血素弱者不計月日否則患手足腰腿痠痛等症名曰褥勞最難治療初産時不可問是男是女恐因言語而泄氣或以愛憎而動氣皆能致病不可獨宿恐致虛驚不可刮舌恐傷心氣不可刷齒恐致血逆須氣血平復方可治事犯時微若秋毫成病重如山嶽可不戒哉産寶新書曰産後血氣暴虛理當大補但惡露未盡用補恐致滯血惟生化湯行中有補能生又能化其方因藥性功用而立名也産後血塊當消而又必隨生其新血若專用消則新血受削專用生則舊血反留考諸藥性芎歸桃仁三味善攻舊血驟生新血佐以黑薑炙草引三味入於肺肝生血利氣五味共方行中有補實産後聖藥也長孫男心典稟按産婦胞衣一破速煎一貼候兒頭下地即服不拘半産正産雖平安少壯婦無恙者俱服一二劑以消血塊而生新血自無血暈之患若胎前素弱至産後見危症不厭頻服病退即止若照常日服一劑可扶將絶之氣血也如血塊痛加肉桂三分紅花三分益母草五錢如産後勞甚血崩形色虛脫加人參三四錢如汗出氣促人參倍加大全曰産後血暈者由敗血流入肝經眼生黑花頭目旋暈不能起坐昏悶不省人事謂之血暈此血熱乘虛逆上凌心故昏迷不省氣閉欲絶也服童便最好陳良甫曰産後瘀血崩心因分娩後不食童便以致虛火炎上也用鹿角燒灰童便調下即醒此物行血極效又用五靈脂半生半熟名獨行散又用返魂丹即益母丸也崔氏曰産婦分娩訖將稱錘或黃石子入炭中燒令通赤置器中於床前以醋沃之可除血暈時作為佳或先取釀醋以塗口鼻仍置醋於旁淬火炭使聞其氣又一法燒乾漆令煙燻産母之面即醒如無干漆舊漆器燒煙亦炒單養賢曰産後寒氣上攻則心痛下攻則腹痛並血塊者宜服生化湯加桂末止加吳茱萸薑三片助血若獨用諸熱藥攻寒其痛難止其血未免來多以傷産母也産寶百問曰産後四肢浮腫由敗血乘虛停積循經流入四肢留淫日深腐壞如水故令面黃四肢浮腫醫人不識此症作水氣治之凡治水多用導水藥極虛人産後既虛又以藥虛之是謂重虛多致大狂服小調經散行血腫消則愈朱丹溪曰産後腫必用大補氣血為主少佐蒼朮茯苓使水自利薛立齋曰前症若寒水侮土宜養脾肺若氣虛浮腫宜益脾胃若水氣浮腫宜補中氣又曰産後浮腫或兼喘咳脈沉細無力此命門火衰脾土虛寒八味丸主之吳蒙齋曰新産後傷寒不可輕易發汗或産時有傷力發熱去血過多發熱有惡露不去發熱有三日蒸乳發熱有因勞動飲食停滯發熱狀類傷食要在仔細詳辨切不可發汗大抵産後大血空虛汗之則變筋惕肉瞤或鬱冒昏迷或搐搦或便祕其害非輕凡有發熱宜與四物為君加柴胡人參炮薑最效蓋乾薑辛熱能引血藥入血分氣藥入氣分且能去惡生新有陽生陰長之道以熱治熱深合內經之旨朱丹溪曰産後發熱此熱非有餘之熱乃陰虛生內熱耳以補陰藥大劑服之必用乾薑者何也曰乾薑能入肺利氣入肝經引血藥生血然不可獨用與補陰藥同用此造化自然之妙王節齋曰婦人産後陰虛陽無所依浮散於外故熱以四物湯補血以炙乾薑之苦溫從治收其浮散之陽以歸於陰也趙養葵曰産後大失血陰血暴亡必大發熱名陰虛發熱此陰字正謂氣血之陰若以涼藥正治必斃正所謂症象白虎誤服白虎必死此時偏不用四物有形之血不能驟生幾希之氣須當急護宜用獨參湯或當歸補血湯使無形生出有形來陽生陰長之妙不可不知也武叔卿曰産後陰虛血弱發熱四物加茯苓熱甚加炮薑此方全不用氣藥是血虛氣不虛也加茯苓者使天氣降而陰自生陰生則熱自退熱甚加炒乾薑者取從陽引陰亦可從陰引陽微乎微乎郭稽中曰産後乍寒乍熱者何曰陰陽不和與敗血不散皆令乍寒乍熱也二者何以別之曰時有剌痛者敗血也但寒熱無他症者陰陽不和也薛立齋曰人所主者心心所主者血心血一虛神氣不守驚悸所由來也當補血氣為主産寶百問曰産後虛羸漸成蓐勞皆由産下虧損血氣所致須慎起居節飲食調養百日庶保無疾若中年反難産者勿論日期必須調養平復方可動作否則氣血復傷虛羸之症作矣薛立齋曰蓐勞當扶養正氣為主多因脾胃虛弱飲食減少致諸經疲憊當補脾胃飲食一進精氣生化諸臟有所賴其病自愈産乳集曰産後小便不通腹脹如鼓悶亂不醒蓋由未産前內積冷氣遂致産後尿胞受病用鹽於臍中填平用蔥白搗一指厚安鹽上以艾炷蔥餅上灸之覺熱氣入腹內即時便通神驗朱丹溪曰有收生不謹損破産婦尿脬致病淋漓用豬羊胞煎湯入藥參耆為君歸地為佐桃仁陳皮茯苓為使於極飢時飲之令氣血驟長其胞自完稍緩亦難成功也醫暇巵言曰女子産育哺養以乳乳之體居經絡氣血之間也蓋自寅時始於手太陰肺經出於雲門穴穴在乳上陰陽繼續以行周十二經至丑時歸於足厥陰肝經入於期門穴穴在乳下出於上入於下肺領氣肝藏血乳正居於其間也蕭慎齋曰婦人以血用事上為乳汁下為月水而血之所化則本於脾胃飲食之精微運行而為乳為經産後脾胃之氣旺則血旺而乳多脾胃之氣衰則血減而乳少此立齋通乳汁以壯脾胃滋化源為要也若不顧脾胃以補氣血徒從事於通乳之劑是猶求千金於乞丐而不可得矣達生篇曰通乳用黃耆一兩當歸五錢白芷木通各三錢以豬蹄湯煎服薛立齋曰凡婦人氣血方盛乳房作脹或無兒飲痛脹寒熱用麥芽二三兩炒熟水煎服之立消其耗散血氣如此何脾胃虛弱飲食不消方中多用之一云麥芽最消腎若氣血虛而乳汁自出者宜十全大補湯
