body:
  text: 續記傅廉該觀察清河時其弟南安寄來慎修修園又號慎修醫書兩卷東皋四書文八卷披閱不倦題句云東皋制藝慎修醫書萬頃汪洋孰望涯辛酉余到直候補叨識於牡牝元黃之外此一時之盛事也亦彼時之僅事也日者奉委赴熱河稟辭甫出又傳入署曰雅著數種俱經抄錄詳加評點但集中闕婦人陰挺一症此症北方最多亦最除逆而難治必不可闕若到熱河辦公公餘當續補之余答以近日醫過兩人獲效之故差次繁冗之中尚恐立論弗詳不如即於寓中走筆書之書成呈閱一閱一擊節又問曰聞二十年前患此者少自此地種產甘薯婦人食之多生此瘡蓋以瘡形與甘薯相仿也余曰此一想當然語其實不然甘薯始自閩省俗名地瓜性同山藥而甘味過之閩自福清以南及漳泉二府濱海外以此作飯終身不生他病本草從新謂其補脾胃驅濕熱養氣血長肌肉海濱人多壽皆食此物之故金薯譜極贊其功閩人治下痢以白蜜同煎食之甚效婦人患赤白帶用此法亦效可知其利濕熱之功尤巨也鄙意以甘薯堪為陰挺證之專藥蓋以陰挺之本不離於濕而此為探本之治陰挺之形突出如瓜而此為象形之治患此者令其如法服藥敷藥之外又以此物代飯其效當必更速觀察曰善請附於前著之後以補千古之闕並折一時之疑洵大方便之一事
