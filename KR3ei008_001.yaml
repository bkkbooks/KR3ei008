body:
  text: 卷一調經門人問曰婦人以血為主醫者輒云血海可以實指其所在乎陳修園曰人身之血海胞也居膀胱之外而為膀胱之室經云衝脈任脈皆起於胞中是男女皆有此血海但男則運而行之女則停而止之運行者無積而不滿故陽氣應日而一舉停止者有積而始滿故陰血應月而一下此男女天癸之總根也而婦人一科專以月事為主經云任脈通太衝脈盛月事以時下故能有子蓋時者滿三旬之期而一下以象月盈則虧下之不失其期故名月信門人高子問曰女科中好手甚少不可不大為之振作因執女科書數十種屬余擇而授之余遍閲大有悟曰古人以月經名為月信不止命名確切而月事之有無多少遲速及一切治療之原委無不包括於信字之中夫五行之土猶五常之信也脾為陰土胃為陽土而皆屬信信則以時而下不愆其期雖曰心生血肝藏血衝任督三脈俱為血海為月信之原而其統主則惟脾胃脾胃和則血自生謂血生於水穀之精氣也若精血之來前後多少有無不一謂之不調不調則為失信矣經云土太過則敦阜阜者高也敦者厚也既高而又厚則令除去宜用平胃散加大黃白芍藥枳實桃仁之類經又云土不及則卑監卑者下也監者陷也坑也既下而又陷坑則令培補宜六君子湯加芎歸柴芍及歸脾湯之類此言經水不調以虛實分之也又有以陰陽偏勝分之者許叔微云婦人病多是月經乍多乍少或前或後時發疼痛醫者一例呼為經病不辨陰勝陽陽勝陰所以服藥少效蓋陰氣勝陽氣則胞寒氣冷血不運行經所謂天寒地凍水凝成冰故令乍少而在月後或斷絶不行若陽氣勝陰則血氣散溢經所謂夏暑地熱經水沸騰故令乍多而在月前或一月數下或崩漏不止當別其陰陽調其氣血使不相乖以平為期此叔微統論陰陽之道也而余則以陰陽二字專指脾胃而言蓋脾者太陰之濕土也不得陽明燥氣以調之則寒濕盛而陰獨勝陰道常虛即內經卑監之旨也胃者陽明之燥土也不得太陰之濕氣以調之則燥熱盛而陽獨勝陽道常實即內經敦阜之旨也至於用方以四物湯加香附茯神炙草為主陰勝加乾薑桂附吳萸及桃仁紅花之類陽勝加知柏芩連門冬之類平平淺淺中亦不可廢若求其所以然之妙金匱溫經湯一方無論陰陽虛實閉塞崩漏老少善用之無不應手取效此不特今之習女科者聞之吐舌即數百年來注金匱之家或識見不到而不能言或珍為枕祕而不肯言今修園老矣不得不擇人而傳之但既傳之而又囑之曰靈樞經載黃帝謂雷公曰此先師之所禁割臂歃血之盟也凡思議不可及之方若輕以示人則氣泄而不神必擇大學問之人知其居心長厚者而後授之門人問曰女人之經一月一行其常也或先或後或通或塞其病也間或有不關於病者願聞其說曰天下事有常而即有變婦人當月事之期其血不下只見吐血衄血或眼耳出血者是謂倒經逆行有三月一行者是謂居經有一年一行者是謂避年有一生不行而受胎者是謂暗經有受胎之後月月行經而産子者是謂胎盛俗名垢胎有受胎數月血忽大下而胎不墜者是謂漏胎此雖異常而數患之竟不害事也彼皆以妄為常而中土失其主信之道如人無信行全賴狡詐以成家君子不為也大抵婦人患此者性情亦必乖張門人問曰經候不調既得聞命矣今願聞調經之法曰諸家調經之說是非參半而蕭慎齊以調經莫先於去病録李氏之論一條以分因詳證治法録方氏之論一條又參以統論二氏之說深合鄙意今全録於後李氏云婦人月水循環纖疴不作而有子若兼潮熱腹痛重則咳嗽汗嘔或瀉有潮熱則血愈消耗有汗咳嘔則氣往上行瀉則津偏於後痛則積結於中是以必先去病而後可以滋血調經就中潮熱疼痛尤為婦人常病蓋血滯積入骨髓便為骨蒸血滯積瘀與日生新血相搏則為疼痛血枯不能滋養百骸則蒸熱於內血枯胞絡火盛或挾痰氣食積寒冷則為疼痛凡此諸病皆阻經候不調必先去其病而後可以調經也方氏曰婦人經病有月候不調者有月候不通者然不調不通中有兼疼痛者有兼發熱者此分而為四也細詳之不調中有趨前者有退後者趨前為熱退後為虛不通中有血枯者有血滯者血滯宜破血枯宜補也疼痛中有時常作痛者有經前經後作痛者常時與經前為血積以經後為血虛也發熱中有常時發熱者有經行發熱者常時為血虛有積經行為血虛而有熱也是四者之中又分為八矣人之氣血周流忽有憂思忿怒則鬱結不行經前産後忽遇飲冷形寒則惡露不盡此經候不調不通作痛發熱所由作也大抵氣行血行氣止血止故治血病以行氣為先香附之類是也熱則流通寒則凝塞故治血病以熱藥為佐肉桂之類是也蕭慎齊曰按婦人有先病而後致經不調者有因經不調而後生諸病者如先因病而後經不調當先治病病去經自調若因經不行而後生病當先調經則經調病自除李氏一論可謂調經之要然偏而不全余故補其未盡之旨若方氏分因詳症誠得統論調經大法門人問曰夫子以月事為月信專主脾胃不托內經之字句而獨得其精華究竟從何節得來乎曰詩以思無邪蔽之禮以毋不敬該之余此論從二陽之病發心脾一節領會出來今録其原文又採集各家之注願學者熟讀而有得之內經云二陽之病發心脾有不得隱曲女子不月其傳為風消其傳為息賁者死不治馬元臺注云二陽足陽明胃脈也為倉廩之官主納水穀乃不能納受者何也此由心脾所發耳正以女子有不得隱曲之事郁之於心故心不能生血血不能養脾始焉胃有所受脾不能化而繼則漸不能納受故胃病發於心脾也由是水穀衰少無以化精微之氣而血脈遂枯月事不能時下矣余擬用歸脾湯重加鹿茸麥門冬服二十餘劑可愈武叔卿注云此節當從隱曲推解人有隱情曲意難以舒其衷則氣鬱而不暢不暢則心氣不開脾氣不化水穀日少不能變化氣血以入二陽之血海血海無餘所以不月余擬用歸脾湯加芍藥柴胡傳為風消者風之名火之化也消消瘦也發熱消瘦胃主肌肉也余擬用歸脾湯加丹皮梔子地骨皮芍藥傳為息賁者喘息上奔胃氣上逆也余用金匱麥門冬湯人無胃氣則死故云死不治此一節為經血本原之論也門人問曰婦人經閉或因家務煩惱或因胎産乳子受傷其不調也有自室女何以亦有不調之病乎余曰室女患此甚於婦人所以多死室女乃渾全之人氣血正旺不應阻塞竟患經閉不行若非血海乾枯則為經脈逆轉血海乾枯者宜用當歸補血湯加麥冬白芍各五錢炙甘草二錢虛極者加附子一錢以助之倘或失治則內熱咳嗽肌肉甲錯毫髮焦落而成怯症矣經脈逆者宜用金匱麥門冬湯芍藥甘草湯加牛膝茜草之類兼服四烏鰂骨一蘆茹丸以調之倘或失治則為吐血衄血咳嗽骨蒸而成瘵病矣若肝火熾盛左脅刺痛頸生瘰癧佐以逍遙散加栝蔞川貝母生牡蠣青皮之類若肝木弦上寸口魚際非藥所能治即與壻配則愈或與加味逍遙散若體常怯寒食少腹脹佐以六君子湯加乾薑之類歸脾湯八珍湯可以出入互用然余又有深一層治法憶余乾隆辛丑歲朱紫坊黃姓之女年方二十二歲始因經閉服行經之藥不效後泄瀉不止食少骨瘦如柴服四神八味之類瀉益甚而五更至天明數次便後帶血余主用金匱黃土湯以赤石脂易黃土以乾薑易附子每服加生鹿茸五錢意以先止其泄瀉便紅然後再調其經水連服八劑泄瀉如故而經水通矣又服五劑瀉血俱止後服六君子湯加乾薑收功可知鹿茸入衝任督三脈大能補血非無情之草木所可比也又閲喻嘉言寓意草載楊季登之女經閉年餘發熱食少肌削多汗而成勞怯醫見多汗誤謂虛也投參朮其血愈涸余診時見汗出如蒸籠氣水謂曰此症可療處全在有汗蓋經血內閉止有從皮毛間透出一路以汗亦血也設無汗而血不流則皮毛乾槁而死矣宜用極苦之藥以斂其血入內而下通於衝脈則熱退經行而血自止非補藥所能效也於是以龍薈丸日進三次月餘忽覺經血略至汗熱稍輕姑減前丸隻日進一次又一月經血大至淋漓五日而諸病全瘳矣附此二案為一虛一實之對學者當一隅而三反之門人問曰女科書一病一方且一病而有數方其方倍於男子此書於調經一書止取一十九方毋乃太簡乎曰內經只有十二方傷寒論止有一百一十三方金匱止有二百四十三方可以謂之方唐以後合法者甚少其餘不過彙集藥品不可以名方而女科所傳之方更為淺陋大失神農本經之旨與伊聖制方之法淺陋之方姑任淺陋之醫輩用之淺陋之病家服之服之不愈亦無怨言或日久而病氣衰亦自愈余姑置弗論也今諸同學皆好學深思士也儒者以濟人為心以我之獨知俯視一切未免驚俗恐濟人不廣禮貴從俗醫道何獨不然今取習用之方而精選之即如四物湯本淺近而無深義也余則加入香附茯神各二錢為佐是取鐵翁道人之交感丸參贊其內交感者以氣之化於無形也又加炙甘草四錢為君是取仲景先生之復脈湯主持其際復脈者以血之運而不息也變淺近為神奇惟熟讀內經本經仲景書者方信余言之不謬又有加減套法經血先期而至加芩連知柏後期而至加薑桂艾葉實者加陳皮枳實虛者加人參白朮大實而閉者加大黃枳實桃仁牛膝更佐以抵當湯桃仁承氣湯大虛而枯者加參朮鹿茸牛膝外更加以人參養榮湯經行而腹痛拒按者加延胡索木香經已行而腹痛者加人參白朮乾薑經水不通逆行而為吐血衄血者加牛膝澤蘭韭汁童便若腹中素有痞飲食滿悶者除地黃加枳實半夏色紫者風也加荊防白芷黑者熱甚也加芩連丹皮地骨皮淡白者虛也有挾痰停水以混之加參耆陳半色如煙塵水如屋漏水者合二陳湯再加防風秦艽蒼朮如豆汁者加芩連或帶黃渾濁者濕痰也或成塊作片血不變者氣滯也加元胡枳實陳皮色變紫黑者屬熱者多屬寒者亦有之宜察脈審症此外若惡寒發熱頭痛有汗加桂枝薑棗無汗加麻黃細辛之類詳於海藏六合湯不贅其餘歸脾逍遙各方雖不可與內經四烏鰂骨一蘆茹丸等方並論而視益母勝金丹巽順丸之類則敻乎遠矣古今方十九首平胃散治土氣太過經血不調達生篇加芒硝能下死胎六君子湯方中參朮苓草脾藥也陳皮半夏胃藥也經血生於脾胃故加歸芍之類便是調經之的方四物湯婦科總方時人習用之方中妙在川芎一味新定加味四物湯方論見上十全大補湯八珍湯二方氣血雙補其用藥品雖雲板實卻亦平穩可從人參養榮湯五臟兼補視八珍十全等高一格以藥品之輕重得法也生白芍一錢五分人參當歸陳皮桂心徐靈胎蘭臺軌範云是小桂枝去皮非肉桂心黃耆茯苓白朮炙草各一錢遠志去骨五分五味十四粒熟地七錢半加生薑三片紅棗二枚水煎溫服四烏鰂魚骨一蘆茹丸內經調經種子亦治男子陽痿烏鰂魚骨四兩去甲蘆茹一兩長男蔚按以雀卵丸如小豆大食前以鮑魚汁送下五丸今酌增為二錢後人用白毛黑骨雄雞一隻去毛腸不見水擦乾用當歸二兩川芎一兩入前藥於雞腹內加酒二碗童便一碗蒸到汁干將雞取淨肉和藥曬為末或加香附四兩炒茯神人參各一兩為末煉蜜為丸如梧桐子大酒送下或米湯送下抵當湯通瘀猛劑見傷寒論桃仁承氣湯通瘀緩劑見傷寒論蠶砂酒治月經久閉按此方較上二方更為平穩蠶砂四兩炒半黃色無灰酒一壺上重湯煮熟去砂溫飲一盞即通歸脾湯內經二陽之病發心脾一節此方頗合經旨當歸茯神人參炙耆白朮棗仁龍眼肉各二錢木香炙草各一錢水煎服高鼓峰云男婦怯弱不論何症止以此方去木香加芍藥麥冬五味子服至月餘必愈雖有他方吾不知也按方中全賴木香一味若去之何以成歸脾湯乎若有寒熱往來可加柴胡芍藥若潮熱骨蒸加丹皮地骨皮梔子若起於怫鬱加貝母黃連若腹痛經閉加桃仁紅花元胡索之類逍遙散女子善懷每多憂鬱此方解肝鬱也而諸郁無不兼治趙養葵謂五郁皆屬於肝也方從小柴胡湯套出越鞠丸丹溪解鬱總方易思蘭醫案治寒熱虛實一切雜病皆從此方變化屢用屢驗香附童便制山梔撫芎蒼朮六神麯以蒸餅為丸每服三錢陳米湯送下溫經湯治經閉或經行過多或崩漏不止或久不受胎統名帶下吳萸三兩當歸川芎芍藥人參桂枝阿膠丹皮甘草各二兩生薑三兩一本二兩半夏半升一本一升麥冬一升上十二味以水一斗煮取三升分溫三服亦主婦人少腹寒久久不受胎及過期不來歌曰口乾腹滿掌心燒卅六疴該謂十二瘕九痛七害五傷三痼共三十六種詳於金匱淺注中不贅帶下條歸芍膠芎權各二權稱鍾也稱其數各二兩桂參丹草數相侔八物同用二兩也整升重用麥門冬勝任減半一升減其半止用半升也相需半夏速求更佐吳茱萸生姜各三兩閉至期不來崩來而過多不育少腹寒久不受胎者各探幽次男元犀按當歸芎藭芍藥阿膠肝藥也丹皮桂枝即心藥也吳茱萸肝藥亦胃藥也半夏胃藥亦沖藥也麥門冬甘草即胃藥也人參補五臟生薑利諸氣也病在經血以血生於心藏於肝也沖為血海也胃屬陽明厥陰衝脈麗之也然細繹方意以陽明為主吳茱萸用至二兩驅陽明中土之寒即以麥門冬用至一升滋陽明中土之燥一寒一熱不使偏隅所以謂之溫也半夏用至半升生薑用至三兩者以姜能去穢而胃氣安夏能去逆而胃氣順也其餘皆相輔而成其溫之之用絶無逐瘀之品故過期不來者能通之月來過多者能止之少腹寒不受胎者並能治之其神妙不可言矣六味丸壯水之主以制陽光桂附八味丸益火之源以消陰翳二方治婦人經病無子加香附童便浸川貝母當歸各三兩艾葉醋炒二兩多效當歸補血湯治血虛發熱症類白虎但脈不洪長以別之黃耆一兩當歸三錢上水煎服尤在涇金匱翼有生地五錢甘草二錢余未知其所本麥門冬湯治火逆上氣咽喉不利止逆下氣長孫男心典稟按可借治婦人返經上逆吐衄等症蓋以此方專入陽明陽明之脈以下行為順上行為逆衝任之脈麗於陽明三經主血故以此方為正治之法若去粳米加蜂蜜八錢取百花之菁華以補既亡之胃陰更為周到然陽明因虛火而逆者固宜此湯陽明因虛寒而逆者舍吳茱萸之溫降將何道以鎮納之乎噫嘻吐血衄血之症違衆說而專主此湯恐漢唐以下至今日而始聞是語也麥門冬四錢不去心煮半夏二錢大棗二枚炙甘草一錢粳米三錢半人參一錢上諸味清水煎服修園與諸生講學於嵩山之井上草堂座中有謂某醫自誇為女科名手執其常用之方來詢余不覺大發一嘆曰女科本無純粹可觀之書而世上醫輩更不必深求之也然而相傳習用之藥不自知其為害人之品者則有四一曰丹參謂丹參不寒不燥不補不攻一味功兼四物且能去瘀血生新血李士材謂其去瘀之功多於生血為婦人之要藥豈知本草經云丹參味苦微寒主心腹邪氣腸鳴幽幽如走水寒熱積聚破症除瘕止煩滿益氣一名卻蟬生山谷通共三十八字其云主心腹邪氣邪氣二字即下文寒熱之氣也邪在心即煩邪在腹即滿腸居腹內邪氣走於腸中故幽幽鳴如走水積聚亦病於腹積而不散推之不移為症症者徵也以其有形可徵也或聚或散推之則移為瘕瘕者假也言其假借而成也其云益氣者通章以心腹邪氣為提綱邪氣既除則正氣自然受益非丹參能補益之也詳經文之旨專主驅邪且驅心腹之裡邪與四物湯之功用冰炭相反若以平時調理胎前産後之常藥而輒用之攻伐無過臟氣大傷即孟夫子所謂安其危而利其災樂其所亡是也此女科習用丹參之害人一也二曰益母謂益母能通血脈調經水去瘀生新為婦人之良藥豈知本草經云茺蔚子味辛微溫主明目益精除水氣久服輕身莖主癮疹癢可作浴湯一名益母一名益明一名大札生池澤通共四十一字無一字言及婦人經産之症其云微溫者得春木之氣也味辛者得秋金之味也木有制則其性和性和則有輕身之效經所謂風能生物是也其云明目者以肝開竅於目也其云益精者以精生於飲食之精華先散於肝而後藏之於腎也莖主癮疹癢者以洗浴能去肌表之風也若産後膚表微微發熱是外感微風與此物甚為對症若重症則不足恃矣況症重藥輕則病勢日甚一日終至敗壞而莫挽若輩東請西延別有殺人不見血之技修園惡之此女科習用益母草之害人二也三曰何首烏時醫以熟地黃大補陰血恐其膩膈減食竟以何首烏代之豈知何首烏本草經不載而開寶有之極贊其功但為後人新增之品或逞其臆見或得之傳聞不足尚也余惟於久瘧偶用之取其味澀之能截瘧也久痢偶用之取其味苦之能堅腸也若謂其能滋陰補腎如開寶所誇之效吾不信也蓋藥之能滋潤者必其脂液之足也藥之能補養者必其氣味之和也試問滯澀如首烏何以能滋苦劣如首烏何以能補正與地黃相反何以謂其功用相同而相代乎此女科習用何首烏之害人三也四曰鬱金謂婦人之病多起於郁鬱金能解諸郁為婦人之良藥而不知此物神農本草經不載而唐本有之唐本云鬱金味苦寒主血積下氣生肌下血破惡血血淋尿血金瘡原文只此二十三字其雲氣味苦寒者謂氣寒而善降味苦而善泄也其云血積者血不行則為積積不去則為惡血血逆於上從口鼻而出則為衄血吐血血走於下從便溺而出有痛為血淋無痛為尿血金瘡之瘀血不去則血水不斷不能生肌此物所以統主之者以其病原皆由於積血特取其大有破惡血之功也蓋血以氣為主又標之曰下氣者以苦寒大泄其氣即所以大破其血視他藥更進一步解鬱二字不見經傳切不可惑此邪說若經水不調因實而閉者不妨以此決之若因虛而閉者是其寇仇且病起於郁者即內經所謂二陽之病發心脾大有深旨若錯認此藥為解鬱而頻用之十不救一至於懷孕最忌攻破此藥更不可以沾唇即在産後非熱結停瘀者亦不可輕用若外邪未淨者以此擅攻其內則邪氣乘虛而內陷若氣血兩虛者以此重虛其虛則氣血無根而暴脫此女科習用鬱金之害人四也聖經灼然可據雜書雜說居然魚目混珠甚為不解昔人謂不讀人間非聖書吾深有味乎斯言也嘗考神農作赭鞭鉤𨨪從六陰陽與太乙外五嶽四瀆土地所生草石骨肉心灰毛羽干類皆鞭問之得其所能治主當其五味一日七十毒是神農本草經為辨藥之祖何以後人食唐宋以後之唾餘或取雜書附會鋪張之說及各氏臆斷邪說竟與聖經為難斯人也侮聖人之言吾有四字勘語曰庸惡陋劣不可以為醫人鏡經謂當碎其碑汙其面正非過激之談種子門人問曰婦人何以無子曰婦人無子皆由經水不調經水所以不調者皆由內有七情之傷外有六淫之感或氣血偏盛陰陽相乘所致種子之法即在於調經之中前論已詳矣若經水既調身無他病而亦不孕者一則身體過於肥盛脂滿子宮而不納精也前人有啓宮丸一方頗超然修園最厭女科書排列許多方名徒亂人意究竟是二陳湯加蒼朮川芎六神麯香附之類不如直說出來更妙一則身體過於羸瘦子宮無血而精不聚也景嶽有育麟珠極效然亦是八珍湯加菟絲子鹿茸霜川椒杜仲四味似亦不必另立名色也其有生女不生男者系以男人督脈不足陽不勝陰令其男人以鹿茸四具人參一斤遠志四兩菟絲子半斤醇酒為丸服之所謂得其要者一言而盡他書皆繁而無當也啓宮丸時方半夏制蒼朮香附各四兩童便浸炒六神麯炒茯苓生研陳皮各二兩鹽水炒川芎三兩蒸餅丸酒下三錢服蒼朮又一本作白朮育麟珠時方鹿角霜川芎白芍生白朮茯苓各二兩川椒一兩人參二兩當歸四兩杜仲甘草各一兩菟絲地黃各四兩上為末煉蜜為丸如梧桐子大米湯無灰酒送下門人問曰婦人不能得孕或易於得孕可以診脈而預知之否乎曰陳楚良云人身血氣各有虛實寒熱之異惟察脈可以知舍脈而獨言藥者妄也脈不宜太過而數數則為熱不宜不及而遲遲則為寒不宜太有力而實實者正氣虛火邪乘之以實也治法當散郁以伐其邪邪去而後正可補不宜太無力而虛虛乃血氣虛也治法當補其氣血又有女子氣多血少寒熱不調月水違期皆當診脈而以活法治之務使夫婦之脈和平有力交合有期不妄用藥乃能生子也門人問曰東垣言婦人經水甫靜三日前交者成男以精勝於血也三日後交者成女以血勝於精也七日子宮既閉雖交而亦不孕褚氏言血先至裹精以生男精先至裹血則生女道藏言月水淨後一三五成男二四六成女聖經言因氣而左動陽資之則成男因氣而右動陰資之則成女程鳴謙言精之百脈齊到勝乎血則成男血之百脈齊到勝乎精則成女此皆一偏之言不足以語乾坤陰陽之道也老子云天法道道法自然亦惟順之而已然天命雖聽其自然而人事亦不可不盡敢問求嗣果有其法否乎曰袁了凡云天地生物必有絪縕之時萬物化生必有樂育之候貓犬至微將受娠也其雌必狂呼而奔跳以絪縕樂育之氣觸之不能自止耳此天然之節候生化之真機也凡婦人一月經行一度必有一日絪縕之候於一時辰間氣蒸而熱昏而悶有欲交接不可忍之狀此的候也此時逆而取之則成丹順而施之則成胎矣門人問曰婦科論種子繁雜無所適從而至當不易之法當宗誰氏曰宋駱龍吉有內經拾遺一書明人增補之內附種子論一首方三首卓然不凡論曰男女媾精萬物化生則偏陰不生偏陽不長理有必然者也然夫婦交媾而不適其會亦偏陰偏陽之謂也則以無子而諉於天命豈不泥乎間有資藥餌以養精血候月經以種孕育多峻補以求詭遇又求嗣未得而害己隨之深可痛可惜也茲幸拜名師於百年中而得有祕授焉一曰擇地二曰養種三曰乘時四曰投虛地則母之血也種則父之精也時則精血交感之會也虛則去舊生新之初也余聞之師曰母不受胎者氣盛血衰之故也衰由傷於寒氣感於七情氣凝血滯榮衛不和以致經水前後多少謂之陰失其道何以能受父不種子氣虛精弱故也弱由過於色欲傷乎五臟臟皆有精而藏於腎腎精既弱闢之射者力微矢枉不能中的謂之陽失其道何以能種故腴地也不發瘠種而大粒亦不長磽地調經養精之道所宜講也誠精血盛矣又必待時而動乘虛而入如月經一來即記其時算至三十時辰則穢氣滌淨新血初萌虛之時也乘而投之如恐情竇不開陰陽背馳則有奇砭納之戶內以動其欲庶子宮開兩情美真元媾合如魚得水雖素不孕者亦孕矣此法歷試歷驗百發百中者也豈謬言哉及其既孕欲審男女先以父生年一爻在下母生年一爻在上後以受胎之月居中或遇乾坎艮震陽象也則生男或遇巽離坤兌陰象也則生女有可預知者焉嗚呼始而無子者非天也人自戕其天也已而有子者亦非天也人定可以勝天也時方三首廠嗣丸此方乃論中所謂奇砭納之戶內者也沉香丁香吳萸官桂白芨各一錢蛇床子木鱉子杏仁砂仁細辛各二錢上十味煉蜜為丸如緑豆大固精丸以下二方乃論中所謂養精調經之平和藥也附子一枚重八錢臍心作竅如皂角子大入硃砂三錢濕紙包煨用一半牡蠣一枚漳泉二府所出者童便遍塗厚紙裹米醋浸透鹽泥固濟候乾以炭三斤煨之桂心去皮龍齒當歸酒焙洗石菖蒲燒去毛山茱去枝梗烏藥天台者益智去枝梗杜仲酒洗去絲牛膝浸酒秦艽細辛桔梗半夏鹽湯泡七次防風川椒去子併合口者茯神白芍各三錢乾薑一兩半炒半生遼參一兩上二十一味研糯米為丸取附子肉硃砂為衣如桐子大每服三十丸加至七十丸空心淡醋湯或鹽湯任下增損地黃丸治月經不調久而無子當歸二兩全用熟地黃半斤懷慶者佳黃連一兩淨上三味酒浸一宿焙乾為末煉蜜為丸桐子大每服五十丸至一百丸如經少溫酒下經多米湯下外備方三首五子衍宗丸治男人精虛無子陽事不舉菟絲子八兩枸杞子覆盆子各四兩五味子車前子各三兩煉蜜為丸如梧桐子大每早米湯送下三錢時法以左尺虛為天一之水衰宜合六味地黃丸右尺虛為地二之火衰宜合桂附地黃丸兩尺俱虛為水火俱衰宜合十補丸余每用加人參鹿茸魚鰾各四兩或以黃耆一斤熬膏和蜜煉為丸為效較速長孫男心典按凡物之多子者久服之亦令人多子且菟絲子車前煮汁膠膩極似人精故能益精而聚精況又得枸杞覆盆皆滋潤之品以助之乎尤妙在五味子收澀與車前子之通利並用大具天然開闔之妙亦時方之頗有意義者修園於女科擇用數方之後必短注數語諸子讀之咸謂語短味長起而問曰脾胃之藥以米湯送下正法也而治肝之劑亦用之者聚震坤合德之義也治肺之劑亦用之者取火歸土旺之義也惟腎處最下用藥宜速其下行若雜以脾胃之藥恐逗留其下行之性濡滯於中而作脹前者時行之某醫治一老婦評於方後云老年陰虛當以六味地黃丸為主而脾胃又須兼顧加入粳米八錢為脾胃雙補立法夫子聞之而噴飯茲何以補腎諸丸而以米湯送下乎曰內經云精不足者補之以味味者五穀之正味也扁鵲云損其腎者益其精精者五穀之精華也洪範論味而曰稼穡作甘甘者正味也世間物惟五穀得味之正但能淡食穀味最能養精袁了凡云煮粥飯中有厚汁滾作一團者此米之精液所聚食之最能補精余於補腎各丸必以米湯送下者此物此志也若時醫以熟地黃與白朮粳米同用者則有毫釐千里之差耳十補丸治血氣兩虛先天之水火俱衰少年而有老態者鹿茸澤瀉附子肉桂山茱薯蕷茯神人參當歸白朮各等分煉蜜為丸如梧桐子大米湯送下三錢此方與十全大補同意但十全大補湯從氣血之流行處著眼氣血者後天有形之用也此方從水火之根本處著眼水火者此是先天無形之體也二方之分別在此新定加味交感丸治婦人不育香附去毛水浸一晝夜炒老黃色半斤菟絲子一斤制當歸童便浸曬乾茯神各四兩生研次孫男心蘭稟按水與土相調則草木生脾與腎相和則胎息成菟絲子一物而備水土之氣故取之為君當歸能滋子宮之乾燥故取之為使至於香附茯神鐵甕翁名交感丸其效詳載於內經拾遺中不待贅論門人問曰轉女為男果有此法否乎曰於傳有之有令孕婦佩極大之雄黃者有令著本夫之衣冠環水井而左旋三周面覷井中之形不令人見者又於床下暗存刀斧刀背向上刀口向下者密存雄雞毛羽於席下者吾亦姑藏其說而弗論之大抵厚積陰功廣行善事而不沒人善更為第一善事不必持齊祈禱定叫熊羆之占
