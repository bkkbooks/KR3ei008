body:
  text: 卷四雜病門人問曰此書調經種子胎前三篇引經外又參以時法或附以新論可謂宜古宜今賢愚皆可共曉而産後一篇雜病一篇全録金匱原文襯以小注而串講之諸家雜説姑附於後不加一字論斷一書體例如出兩手何歟曰群言淆亂衷於聖仲景後無書可讀而婦人産後各家各逞臆説互相議論余所以止録金匱全文如日月一出爝火無光至於雜病原與男子無異而各家竟與男子各病外強分出病名轉覺多事然亦有與男子必須分別者金匱第二十二篇中已具大要而第八節更為綱舉目張無復剩義其文深奧難讀余逐節襯以小注一目瞭然則難讀而易讀矣其不以新論新案贅之者恐添蛇足也且夫學問之道無止境也前此不過為語下之計今既讀過三篇從此日新而月異可以語上微夫人吾誰與歸金匱云婦人中風七八日業已熱退而身涼而復續來寒熱發作有一定之時因其病而問其經水已來而適斷者蓋以經水斷於內而寒熱發於外雖與經適來者不同而此症亦名為熱入血窒其血為邪所阻而必結結於沖任厥陰之經脈內未入臟外不在表而在表裡之間乃屬少陽故使寒熱往來如瘧狀發作有定時以小柴胡湯主之達經脈之結仍借少陽之樞以轉之俾氣行而血亦不結矣此為中風熱入血室經水適斷者出其方治也蓋以邪既流連於血室而亦浸淫於經絡若但攻其血血雖去而邪必不盡且恐血去邪反得乘虛而入也故以小柴胡湯解其熱邪而乍結之血自行矣熱入血室不獨中風有之而傷寒亦然婦人傷寒寒鬱而發熱當其時經水適來過多不止血室空虛則熱邪遂乘虛而入之也晝為陽而主氣暮為陰而主血今主氣之陽無病晝日明瞭主血之陰受邪故暮則譫語譫語皆非習見之事如見鬼狀者醫者可於其經之適來而定其症曰此為熱入血室非陽明胃實所致也既非陽明胃實則治之者無以下藥犯其胃氣以及上二焦一曰胃脘之陽不可以吐傷之一曰胃中之汁不可以汗傷之惟俟其經水盡則血室之血復生於胃腑水穀之精必自愈此為傷寒熱入血室經水適來者詳其症治也師不出方蓋以熱雖入而血未結其邪必將自解汗之不可下之不可無方治之深於治也郭白雲謂其仍與小柴胡湯或謂宜刺期門猶是淺一層議論婦人中風發熱惡寒當表邪方盛之際經水適來蓋經水乃衝任厥陰之所主而衝任厥陰之血又皆取資於陽明今得病之期過七日而至八日正值陽明主氣之期病邪乘虛而入邪入於裡則外熱除其脈遲身涼和已離表症惟衝任厥陰俱循胸脅之間故胸脅滿但滿不痛與大結胸之不按自痛小結胸之按而始痛分別究其滿甚亦如結胸之狀而且熱與血搏神明內亂而作譫語者此為熱入血室也治者握要而圖當刺肝募之期門隨其實而取之何以謂之實邪盛則實也此承本篇第一節而言中風熱入血室之症治也但第一節言寒熱已除而續來此言寒熱方盛而併發前言經水已來而適斷此言方病經水之適來前言血結而如瘧此言胸脅滿如結胸前無譫語而此有譫語以此為別然亦有不在經水適來與肝膜而為熱入血室者不可不知陽明病下血譫語者此為熱入血室其症通身無汗但頭上汗出當刺期門隨其實而瀉之令通身濈然汗出者愈此言陽明病亦有熱入血室者不必拘經水之來與斷也但其症下血頭汗出之獨異也蓋陽明之熱從氣而入血襲入胞宮即下血而譫語不必乘經水之來而後熱邪得以入之彼為血去而熱乘其虛而後入此為熱入而血有所迫而自下也然既入血室則不以陽明為主而以衝任厥陰之氣不通故一身無汗鬱而求通遂於其腑之少陽而達之故頭上汗出治法亦當刺期門以瀉其實刺已周身濈然汗出則陰之閉者亦通故愈婦人咽中帖帖然如有炙臠吐之不出吞之不下俗謂之梅核病多得於七情鬱氣痰凝氣阻以半夏厚朴湯主之此為痰氣阻塞咽中者出其方治也徐忠可云余治任小乙咽中每噎塞咳嗽不出余以半夏厚朴湯投之即愈後每復發細問之云夜中燈下每見暈如團五色背脊內間酸其人又壯盛知其初因受寒陰氣不足而肝反鬱熱甚則結寒微動挾腎氣上衝咽喉塞噎也即於此方加大劑枸杞菊花丹皮肉桂暈乃漸除而咽中亦愈故曰男子間有之信不誣也婦人臟燥臟屬陰陰虛而火乘之則為燥不必拘於何臟而既已成燥則病症皆同但見其悲傷欲哭象如神靈所作現出心病又見其數欠善伸現出腎病所以然者五志生火動必關心陰臟既傷窮必及腎是也以甘麥大棗湯主之此為婦人臟燥而出其方治也麥者肝之谷也其色赤得火色而入心其氣寒乘水氣而入腎其味甘具土味而歸脾胃又合之甘草大棗之甘妙能聯上下水火之氣而交會於中土也婦人吐涎沫上焦有寒飲也醫者不與溫散而反下之則寒內入而心下即痞當先治其吐涎沫以小青龍湯主之俾外寒內飲除而涎沫可止涎沫止後乃治其痞亦如傷寒表解乃可攻裡之例也瀉心湯主之此為吐涎沫與痞兼見而出先後之方治也婦人之病所以異於男子者以其有月經也其因月經而致病者則有三大綱曰因虛曰積冷曰結氣三者或單病或兼症或互病或相因而為病或偏勝而為病病則為諸經水斷絶此婦人之病根也其曰諸者奈何以經水有多少遲速及逢期則病與大崩漏難産之後不來等症皆可以此例之無論病之初發以至病有歷年大抵氣不足則生寒氣寒則血亦寒由是冷浸不去而為積氣著而為不行結胞門為寒所傷由外而入內由內而達外漸至經絡凝堅經水之源頭受傷則病變無窮矣然又有上中下之分其病在上肺胃受之若客寒而傷近於胃口則為嘔吐涎唾或寒久變熱熱盛傷肺則成肺癰其形體之受損則一而為寒為熱儼若兩人之分病若在中肝脾受之邪氣從中盤結或為繞臍寒疝或為兩脅疼痛與胞宮之臟相連此寒之為病也或邪氣鬱結為熱中熱鬱與本寒相持痛在關元脈現出數熱而身無潰爛與疼癢等瘡其肌膚乾燥狀若魚鱗遇逢交合時著男子非止女身此熱之為病也所以然者何義蓋以中者陰陽之交也雖胞門為寒傷則一而中氣素寒者以寒召寒所謂邪從寒化是也中氣素熱者寒旋變熱所謂邪從熱化是也病若在下腎臟受之也窮而歸腎症卻未多經候不勻令陰中掣痛少腹惡寒或上引腰脊下根氣衝氣衝急痛膝脛疼煩蓋以腎脈為陰之部而衝脈與少陰之大絡並起於腎故也甚則奄忽眩冒狀如厥癲所謂陰病者下行極而上也或有憂慘悲傷多嗔所謂病在陰則多怒及悲愁不樂也總而言之曰此皆帶下非有鬼神言病在帶脈之下為陰非後人以不可見之鬼神為陰也久則肌肉削而羸瘦氣不足而脈虛多寒統計十二症九痛七害五傷三痼之三十六病千變萬端審脈陰陽虛實緊弦行其針藥治危得安其病雖同脈各異源導其所異之處即為探源子當辨記勿謂不然此言婦人諸病所以異於男子者全從經起也病變不一因人稟有陰陽體有強弱時有久暫而分起處以三大綱總冒通節中又分出上中下以盡病變後以此皆帶下四字總結本節之意至於言脈百病皆不外陰陽虛實四個字而又以弦緊為言者蓋經阻之始大概屬寒即有熱症亦由寒之所變氣急則為弦寒甚則為緊示人以二脈為主而參之兼脈則得耳徐靈胎云古人名婦科謂之帶下醫以其病總屬於帶下也凡治婦人必先明衝任之脈衝脈起於氣街在毛際兩旁並少陰之脈挾擠上行至胸中而散任脈起於中極之下臍下四寸以上毛際循腹裡上關元又云衝任脈皆起於胞中上循背裡為經脈之海此皆血之所從生而胎之所由系而帶脈為之總束也學者能明乎帶脈之病則本源洞悉雖所主之病千條萬緒可以知其所從起更合參古人所用之方而神明變化之自不至於浮泛不切之弊矣問曰婦人年五十所七七之期已過天癸當竭地道不通今病前陰血下利數十日不止暮即發熱少腹裡急腹滿手掌煩熱唇口乾燥何也師曰前言婦人三十六病皆病在帶脈之下此病屬帶下何以故曾經半産瘀血在少腹不去何以知之蓋以瘀血不去則新血不生津液不布其證唇口乾燥故知之況暮熱掌心熱俱屬陰任主胞胎沖為血海二脈皆起於胞宮而出於會陰正當少腹部分衝脈挾臍上行衝任脈虛則少腹裡急有乾血亦令腹滿其為宿瘀之症無疑當以溫經湯主之此承上節言歷年血寒積結胞門之重症而出其方治也尤在涇曰婦人年五十所天癸已斷而病下利似非因經所致矣不知少腹舊有積血欲行而未得遞行欲止而不能竟止於是下利窘急至數十日不止暮即發熱者血結在陰陽氣至暮不得入於陰而反浮於外也少腹裡急腹滿者血積不行亦陰寒在下也手掌發熱病在陰掌心亦陰也唇口乾燥血內瘀者不外榮也此為瘀血作利不必治利但治其瘀而利自止矣吳萸桂枝丹皮入血散寒而行其瘀芎歸芍藥麥冬阿膠以生新血人參甘草薑夏以正脾氣蓋瘀久者榮必衰下多者脾必傷也婦人因經致病凡三十六種皆謂之帶下經水因寒而瘀不能如期而利以致小腹滿痛然既瘀而不行則前經未暢所行不及待後月之正期而先至故其經一月再見者以土瓜根散主之此為帶下而經候不勻一月再見者出其方治也按土瓜即王瓜也主驅熱行瘀佐以蟅蟲蠕動逐血桂芍之調和陰陽為有制之節寸口脈輕按弦而重按大弦則為陽微而遞減大則為外盛而中芤減則陽不自振為諸寒芤則陰不守中為中虛寒虛相搏此名曰革革脈不易明以弦減芤虛形容之則不易明者明矣凡婦人妊娠及行經必陰陽相維而後為無病今見此脈則不能安胎而半産不能調經而漏下以旋覆花湯主之此為虛寒而半産漏下者出其方治也但此方與虛寒之旨不合或者病源在肝肝以陰臟而舍少陽之氣以生化為事以流行為用是以虛不可補解其鬱聚即所以補寒不可溫行其氣血即所以溫歟錢氏謂必是錯簡半産漏下氣已下陷焉有用旋覆花以下氣之理二説俱存候商婦人陷經其血漏下不止其血色黑亦不解是瘀血不去新血不生榮氣腐敗然氣喜溫而惡寒以膠薑湯主之此為陷經而色黑者出其方治也方未見林億云想是膠艾湯千金膠艾湯有乾薑似可取用丹溪謂經淡為水紫為熱黑為熱極彼言其變此言其常也婦人少腹滿如敦狀蓋少腹胞之室也胞為血海有滿大之象是血蓄也若小便微難而不渴可知其水亦蓄也若病作於生産之後者此為水與血俱結在血室也宜用水血並攻之法以治大黃甘遂湯主之此為水血並結在血室而為少腹滿大小便難口不渴者出其方治也婦人經水久閉不至者有虛實寒熱之可也又有行而不暢者如一月再見之可徵也若少腹結痛大便黑小便利明知血欲行而不肯利下不得以尋常行血導氣調和營衛補養衝任之法迂闊不效徑以抵當湯主之此為經水不利之屬實者出其方治也婦人經水閉而不利其子臟固有凝滯而成堅癖又因濕熱腐變而為下不止其凝滯維何以子臟中有乾血其下不止維何即濕熱腐變所下之白物時俗所謂白帶是也宜用外消法以礬石丸主之此為經水閉由於子臟有乾血得濕熱而變成白物者出其方治也婦人六十二種風腹中血氣刺痛紅蘭花酒主之此為婦人凡有挾風腹中血氣刺痛者出其方治也言血氣者所以別乎寒疝也六十二種未詳張隱菴云紅花色赤多汁生血行血之品也陶隱居主治胎産血暈惡血不盡絞痛胎死腹中金匱紅蘭花酒治婦人六十二種風又能主治痎瘧臨川先生曰治風先治血血行風自滅蓋風乃陽邪血為陰液此對待之治也紅花救莖葉且多毛刺具堅金之象故能制勝風木夫男女血氣相同仲祖單治婦人六十二種風者良有以也蓋婦人有餘於氣不足於血所不足者乃衝任之脈散於皮膚肌腠之間充膚熱肉生毫毛男子上唇口而生髭鬚女人月事以時下故多未足也花性上行花開散蔓主生皮膚間散血能資婦人之不足故主治婦人之風蓋血虛則皮血之腠理不密而易於生風也此血主衝任故專治胎産惡血靈樞經云飲酒者衛氣先行皮膚故用酒煎以助藥性症邪亦伏於膜原之腠理間故能引其外出夫血有行於經絡中者有散於皮膚外者而所主之藥亦各不同如當歸地黃茜草之類主養脈內之血者也紅蘭花主生脈外之血者也川芎芍藥丹皮紅曲之類又內外之兼劑也學者能體認先聖用藥之深心思過半矣婦人腹中諸疾痛當歸芍藥散主之此為婦人腹中諸疾痛而出其方治也寒熱虛實氣食等邪皆令腹痛謂可以就此方為加減非真以此方而統治之也尤在涇云婦人以血為主而血以中氣為主中氣者土氣也土燥不能生物土濕亦不能生物芎藭芍藥滋其血苓朮澤瀉治其濕燥濕得宜而土能生物疾痛並蠲矣婦人腹中痛小建中湯主之此為婦人虛寒裡急腹中痛者出其方治也長孫心典按傷寒論云陽脈澀陰脈弦法當腹中急痛宜小建中湯主之不瘥更與小柴胡湯問曰婦人病飲食如故煩熱不得臥而反倚息者何也師曰飲食如故者病不在胃也煩熱者陽氣不化也倚息不得臥者水不下行也此名轉胞不得溺也以胞系不順而了戾故致此病但無並症但當利其小便則胞中之氣使之下行氣道斯胞系不了戾而愈以腎氣丸主之此為轉胞症胞系了戾而不得溺者出其方治也了戾與繚戾同言胞系繚戾而不順而胞為之轉胞轉則不得溺也治以此方補腎則氣化氣化則水行而愈矣然轉胞之病亦不盡此或中焦脾虛不能散精歸於胞及上焦肺虛不能下輸布於胞或胎重壓其胞或忍溺入房皆能致此當求其所因而治之也婦人陰中寒宜溫其陰中不用內服止以藥納入謂之坐藥蛇床子散主之此遙承上節令陰掣痛少腹惡寒症而出其方治也但寒從陰戶所受不從表出宜溫其受邪之處則愈蛇床子溫以去寒合白粉燥以除濕以寒則生濕也少陰腎脈滑而數者滑主濕數主熱濕熱相合而結於陰分故令前陰中即生瘡陰中蝕瘡爛者乃經熱之盛而生𧈟也以狼牙湯洗之此為濕熱下流於前陰陰中生瘡蝕爛者出其方治也狼牙草味酸苦除邪熱氣疥瘙惡瘡去白蟲故取治之若無狼牙草以狼毒代之胃氣下泄不從大便為失氣而從前陰吹出而正喧謂其連續不絶喧然有聲此穀氣之實大便不通故也以豬膏發煎主之取其滋潤以通大便則氣從大便而出此通而彼塞也金匱方一十九首小柴胡湯方見傷寒論半夏厚朴湯半夏一斤厚朴三兩茯苓四兩生薑五兩蘇葉二兩上五味以水一斗煮取四升分溫四服日三服夜一服歌曰狀如炙臠貼咽中卻是痰凝氣不通半夏一升苓四兩五兩薑三兩厚朴二兩蘇葉攻次男元犀按方中半夏之降逆厚朴之順氣茯苓之化氣人所盡知也妙在重用生薑之辛以開其結佐以蘇葉之香以散其鬱故能治咽中如有炙臠之症後人變其分兩治胸腹滿悶嘔逆等症名為七氣湯以治七情之病甘麥大棗湯甘草三兩小麥一斤大棗十枚上三味以水六升煮取三升分溫三服亦補脾氣歌曰婦人臟燥欲悲傷如有神靈太息長嘆欠伸小麥一升三兩草十枚大棗力相當魏云世醫競言滋陰養血抑知陰盛而津愈枯陽衰而陰愈燥此方治燥之大法也小青龍湯歌見傷寒論瀉心湯歌見傷寒論溫經湯土瓜根散土瓜根芍藥桂枝蟅蟲各三分上四味杵為散酒服方寸匕日三服歌曰帶下端由瘀血停不能如期而至以致少腹滿痛月間再見既瘀而不行則前經未暢所行不及待後月正期而至故一月再見不循經經常也言不循常期也蟅瓜桂芍均相等調協陰陽守典型次男元犀按方中桂枝通陽芍藥行陰陰陽和則經之本正矣土瓜根驅熱行瘀蟅蟲蠕動逐血治其本而不遺其末無一而非先聖之典型旋覆花湯旋覆花三兩蔥十四莖新絳少許上三味以水三升煎取一升頓服之長孫心典稟按旋覆花鹹溫下氣新絳和血蔥葉通陽此方原治肝氣著滯之病於此症只示其意不可泥其方故前賢疑此方之錯簡膠薑湯方未見或云即是乾薑阿膠二味煎服千金膠艾湯中有乾薑亦可取用大黃甘遂湯大黃四兩甘遂阿膠各二兩上三味以水三升煎取二升頓服其血當下歌曰少腹敦形敦音對古器也周禮磬以乘血敦以乘食少腹高起之狀相似也少腹胞之室也胞為血海其滿大為蓄血也小水難小水難而不渴亦蓄血也水同瘀血兩瀰漫結在血室大黃四兩遂膠二頓服瘀行病自安次男元犀按方中大黃攻血蓄甘遂攻水蓄妙得阿膠本清濟之水伏行地中歷千里而發於古東阿縣之井此方取其以水行水之義也內經謂濟水內合於心用黑驢皮煎造成膠以黑屬於腎水能濟火火熄而血自生此方取其以補為通之義也然而甘遂似當減半用之抵當湯歌見傷寒論師云婦人經水不利下此主脈症並實者否則當養其衝任之源不可攻下礬石丸礬石三分燒杏仁一分去皮尖上二味末之煉蜜為丸如棗核大內臟中劇者再內之歌曰經凝成癖閉而堅白物時流豈偶然蓄泄不時胞宮生濕濕反生熱所積之血轉為溫熱所腐而白物時時自下礬石用三分杏一分納時病去不遷延燒礬驅濕熱且澀能固脫佐以杏仁之苦潤去其乾血一外納之方亦兼顧不遺可知古法之密紅蘭花酒紅蘭花一兩上一味酒一大升煮減半頓服一半未止再服歌曰六十二風義未詳腹中刺痛勢倣徨治風先要行其血一兩紅蘭花酒煮嘗張隱菴注解甚詳不再釋當歸芍藥散方見胎前小建中湯歌見傷寒論方意在扶脾以生血不全恃四物之類也腎氣丸乾地黃八兩山藥山茱萸各四兩茯苓丹皮澤瀉各三兩桂枝附子泡各一兩上八味末之煉蜜和丸梧子大酒下十五丸加至二十丸日再服歌曰小水不通病轉胞胞由氣主一言包胞之內外空虛有氣充塞方不遊移其系自正氣虛則胞無所主其系或致反戾其溺必難矣萸薯四兩桂附一兩丹澤苓三地八兩教此方妙在大補腎氣腎氣足則胞正胞正則系正系正則小便不利而利矣蛇床子散蛇床子一味末之以白粉少許和合相得如棗大綿裹納之自然溫狼牙湯狼牙三兩以水四升煮取半升以綿纏箸如繭浸湯瀝陰中日四遍歌曰胞寒外候見陰中寒納入蛇床佐粉安此溫胞益陽外治之善法為腎氣丸之佐也更有陰中瘡𧈟爛者乃溫熱不潔而生𧈟也狼牙三兩洗何難除濕熱殺蟲如無狼牙草以狼毒代之膏發煎豬膏半斤亂髮如雞子大三枚上二味和膏中煎之發消藥成分再服病從小便出千金云太醫校尉史脫家婢黃病服此胃中燥糞下便瘥神效歌曰陰吹症起大便堅古有豬膏八兩傳亂髮三丸雞子大發消藥熟始停煎門人問曰婦人雜病繁多非筆楮所能盡傷寒論金匱要略二書何一而非婦科之法治乎然而業此者絶少通儒未免以集隘未全為議請於金匱外而續補之何如曰不能續也不必續也爾欲續吾且徇爾續之各家近道之言可録者少今擇數條於下究竟仁者見之謂之仁知者見之謂之知善讀書者自知之而修園不贅也陳良甫曰婦人衝任二脈為經脈之海外循經絡內榮臟腑若陰陽和平則經下依時如勞傷不能約制忽然暴下甚則昏悶若寸脈微遲為寒在上焦則吐血衄血尺脈微遲為寒在下焦則崩血便血法當調補脾胃為主修園按理中湯為要藥李東垣曰聖人治病必本四時升降浮沉之理經漏不止是前陰之氣血已下脫水瀉不止是後陰之氣血又下陷後陰者主有形之物前陰者精氣之門戶前後二陰俱下是病人周身之氣常行秋冬之令主肅殺收藏人身中陽氣上浮殺氣上行則陽生陰長春夏是也既病則周身氣血皆不生長殺氣不升前雖屬熱下焦久脫已化為寒久沉久降寒濕大勝當急救之瀉寒以熱除濕以燥大升大舉以助生長補養氣血不致偏枯聖人立治法云濕氣大勝以所勝平之當調和胃氣而滋元氣如不止用風藥以勝濕此是謂也陳良甫曰婦人血崩心痛名曰殺血心痛由心脾血虛也若小産去血過多而心痛者亦虛也用烏鰂魚骨炒為末醋湯調下失笑散亦效武叔卿曰鹿茸丸治經血過多其色瘀黑甚者崩下呼吸少氣臍腹冷極則汗如雨兩尺脈微細由衝任虛衰為風冷客胞中氣不能固可灸關元百壯夫丹溪以紫黑色為熱此言瘀黑者乃下焦氣寒血凝而黑各有治法然女子氣海在上血海在下故下焦溫而後氣升血行如鹿茸以血成形由氣而長血隨氣上而成角故入血分以生升又以附子艾葉佐而溫之以赤石脂禹餘糧鎮而固之柏葉清之歸地續斷補之誠下元虛寒之全方也不加人參豈無意焉而灸關元之意可想矣武叔卿曰血虛須兼補氣譬之血猶水也氣猶堤也堤堅則水不橫決氣固則血不妄行自然之理也武叔卿曰五靈脂散治血崩不止不拘多少炒令煙盡研末以當歸酒或童便調下三錢一名抽刀散治産後惡血心腹痛不可忍其效如神真急救之良方也人家不可不備並治蛇蠍蜈蚣咬塗傷處立愈張子和曰婦人帶下聖惠方與巢氏二家之説皆非也夫治病當先識經絡人身大經有十二奇經有八脈十二經與八脈通身往來經絡共二十道上下流走環周晝夜不息然此十二經上下周流者止十九道耳惟帶脈起少腹季脅之端乃章門穴也環周一身絡腰而過如束帶之於身難經云帶之為病溶溶如坐井中衝任者是經脈之海也循腹脅夾腦旁傳流於氣衝屬於帶脈絡於督脈督脈者起於關元穴任脈者女子養胎孕之所督乃是督領婦人經脈之海也沖任督三脈同起而異行一源而三岐皆絡於帶脈沖任督三脈皆統於篡戶循陰器行庭孔溺孔上端沖任督三脈以帶脈束之因余經上下往來遺熱於帶脈之間客熱抑鬱熱者血也血積多日不流從金之化而為白乘少腹冤熱白物滿溢隨溲而下綿綿不絶是為白帶多不痛或有痛者因壅礙而成也經曰少腹寒熱溲出白液冤者屈滯也病非本經為他經冤鬱而成此疾皆從濕熱治之遺熱於小腸從金代而為白與治痢同法赤白痢乃邪熱入於大腸赤白帶是邪熱傳於小腸故治二症不可驟用峻熱藥燥之燥之則內水涸內水涸則必煩渴煩渴則小便不利小便不利則足腫面浮漸至不起治法先以導水禹功瀉之次以淡劑降心火益腎水下小溲利水道則愈矣張子和曰赤白痢者是邪熱入於大腸下廣腸出赤白也帶下者傳於小腸入脬經下赤白也據此二症皆可同以治濕之法治之方約之曰帶脈總束諸脈使不妄行如人束帶而前垂也婦人多鬱怒傷肝肝屬木脾屬土肝邪乘脾則土受傷而有濕濕生熱熱則流通故滑濁之物滲入膀胱從小便而出古人作濕寒用辛溫藥則非矣丹溪作濕熱用苦溫藥為是不知用苦寒正治也用辛溫從治也如濕熱拂鬱於內腹痛帶下非辛溫從治能開散之乎若少腹不痛上下赤白帶者雖有濕熱而氣不鬱結用苦寒治之為當也吳梅坡治赤白帶下用自制十六味保元湯骨碎補貫衆去毛三錢杜仲小茴香鹽水炒各一錢五分人參巴戟各二錢黃耆當歸山藥獨活蓮蕊須各一錢石斛升麻茯苓各七分甘草六分黃柏八分桂圓肉二枚又方用六龍固本丸山藥巴戟肉山茱肉各四兩川楝子補骨脂青鹽三錢湯泡人參蓮肉黃耆各二兩小茴香川芎木瓜各一兩張潞玉曰沖為血海即是血室衝脈得熱則迫血下行男子亦有是症不獨婦人也金匱要略水氣篇云問病有血分水分何也師曰經水前斷後病水名曰血水此病為難治先病水後斷經水名曰水分此病易治何以故去水其經自下也汪石山曰凡經先斷而後病水少陰脈沉而滑沉則在裡滑則為實沉滑相搏血結胞門為血分難治若先病水而後病經斷少陽脈牢少陰脈細男子小便不利婦人經水不通經通則為血不利則為水名水分易治此因脾肺虛冷不能通調水道下輸膀胱滲泄之令不行生化之氣不轉東垣云水飲留積若土在雨中則為泥得和氣暖日水濕去而萬物自生長用加減腎氣丸歸脾湯六君子加木香炮薑肉桂外科外科書向無善本無怪業此者只講內消內托內補艾灸神照針砭圍藥熏洗開口收口諸小技儒者薄之而不言所以愈趨而愈下也余少年遇險逆之症凡外科咸束手而無策者必尋出一條大生路為之調理十中可愈六七非有他術蓋從傷寒論中體認十二經之經氣標本而神明乎三百九十七法一百一十三方之中也今於女科雜病後又附外科四症以示其概眼目眼科書分為七十二症類皆不切之陳言各家從而敷衍之陳陳相因曷其有極乎所以有目不醫不盲之誚也而婦人眼病與男子頗殊當以補養腎水以濟沖任胞門血海之血以目得血而能視也又肝開竅於目女子善懷每多憂鬱五郁皆屬於肝又當以疏肝解鬱之藥佐之余新定二方面面周到新定開瞽神方茺蔚子隔紙烘元參酒浸各八兩香附為末以人乳拌五次柴胡酒拌烘各四兩澤瀉酒拌烘防風黃耆汁拌白菊花各三兩上為末煉蜜為丸如梧桐子大每服三錢菊花湯送下又附方枸杞子一斤去蒂並乾燥者不用取羊膽十個瀉汁用冬蜜十兩山泉水一斤攪勻將枸杞浸一宿蒸半炷香曬乾又浸又蒸以汁干為度收藏密貯勿泄氣每早晚各吞三錢以桑葉湯送下瘰癧瘰癧者頸上項側結聚成核纍纍相連或生於胸脅之間重者形如馬刀更重者聚成一片堅硬如鐵俗名鐵板癧必死凡癧多起於耳之前後乃少陰之部位也女子善懷每多憂鬱宜逍遙散加貝母夏枯草牡蠣栝蔞子青皮之類常服虛者加味歸脾湯最妙必須灸肩髃二穴曲池二穴命門一穴氣海一穴足三里二穴方能除根又取大蝦蟆一個去腸洗淨復於癧上以艾如大豆樣灸蝦蟆皮上至熱氣透癧再灸別處如蝦蟆皮焦移易灸之三五日灸一次熏者三次可愈服消癧湯栝蔞一個搗甘草汁三錢皂角一片去弦子大黃三錢五味子一歲一粒水煎服下穢物愈未下再服常服丸方元參蒸牡蠣醋煮川貝母各半斤為末以夏枯草二斤長流水熬膏半碗入熟蜜為丸如梧桐子大每服三錢一日兩服開水送下此症忌刀針及敷潰爛之藥有丹方用羚羊角以磁片刮下為末或用舊明角琉璃刮下為末尤良每斤入貝母四兩全蠍三兩蜜丸空腹服三錢外用皂角入鯽魚腹中煅灰存性蜜和醋調塗無不應效乳癰乳岩附乳縮乳卸經云乳頭屬足厥陰肝經乳房屬足陽明胃經若乳房忽然腫痛數日之外焮腫而潰稠膿湧出膿盡而愈此屬肝胃熱毒血氣壅滯所致名曰乳癰猶為易治若乳岩者初起內結小核如棋子不赤不痛積久漸大崩潰形如熟榴內潰深洞膿水淋漓有巉巖之勢故名曰乳岩此屬脾肺鬱結血氣虧損最為難治乳癰初起若服人參敗毒散栝蔞散加忍冬藤白芷青橘皮生耆當歸紅花之類敷以香附餅即見消散如已成膿則以神仙太乙膏貼之吸盡膿水自愈矣乳岩初起若用加味逍遙散加味歸脾湯二方間服亦可內消及其病勢已成雖有盧扁亦難為力但當確服前方補養氣血縱未脫體亦可延生周季芝云乳癰乳岩結硬未潰以活鯽魚同天生山藥搗爛入麝香少許塗塊上覺癢勿搔動隔衣輕輕揉之以七日一塗旋塗旋消若用行血破氣之劑是速其危也更有乳縮症乳頭縮收肉內此肝經受寒氣斂不舒宜當歸補血湯加乾薑肉桂白芷防風木通之類主之又有乳卸症乳頭拖下長一二尺此肝經風熱發泄也用小柴胡湯加羌活防風主之外用羌活防風白蘞火燒熏之仍以萆麻子四十九粒麝香一分研極爛塗頂心俟至乳收上急洗去此係屬怪症婦人盛怒者多得之不可不識栝蔞散栝蔞一個明乳香二錢酒煎服香附餅敷乳癰即時消散一切癰腫皆可敷香附細未淨一兩麝香二分上二味研以蒲公英二兩煎酒去渣以酒調藥燉熱敷患處神仙太乙膏治一切癰疽不問膿之成否並宜貼之元參白芷當歸肉桂生地赤芍大黃各一兩黃丹十二兩炒篩上藥用麻油二斤內諸藥煎黑濾去滓復將油入鍋熬至滴水成珠入黃丹十二兩再熬滴水中看其硬軟得中即成膏矣如軟再加黃丹數錢加味逍遙散治肝經鬱火頸生瘰癧並胸脅脹痛或作寒熱甚至肝木生風眩暈振搖或咬牙發痙諸症經云木鬱則達之是也北柴胡茯苓當歸天生術甘草白芍牡丹皮山梔炒黑各一錢薄荷五分老生薑一片清水煎附婦人陰挺論陰挺證坊刻外科論之頗詳大抵不外濕熱下注為病薛立齋以補中益氣湯加味逍遙散六味地黃丸知柏八味丸為主以當歸蘆薈丸龍膽瀉肝湯之類為輔可謂高人一著而治之無一效何也蓋為前人濕熱二字誤之也余在籍時醫道頗許可於人治療三十七載閲歷不為不多而陰挺症久未一見意者古人用心周到不過所聞而備其病名乎逮至辛酉以縣令髮直候補公餘之頃時亦兼理斯道方知直隸婦女十中患此病者約有三四甚者突出一二寸及三四寸大如指或大如拳其形如蛇如瓜如香菌如蝦蟆不一或出血水不斷或乾枯不潤或痛癢或頑麻者以致經水漸閉面黃少食羸瘦咳嗽吐血而寒熱往來自汗盜汗病成勞傷而死輕者但覺陰中滯礙而無其形或有形亦不甚顯無甚痛害若經水勻適尚能生育時醫名之曰𤺏又名吃血勞所用之藥均無一效或用刀割一時稍愈旋且更甚余常按前人之法而治之亦未見效未知何故余讀內經金匱千金等書及各家祕藏等本尋其言外之旨而參以所見所聞頗有所悟因知此症南人不患即偶有之治亦易愈北人亦常患治皆罔效自有其故蓋以南人之陰挺由於病變書有其方按法多效北人之陰挺由於氣習病象雖同而病源則異所以弗效其云氣習奈何北俗日坐濕地夜臥土坑寒濕漸積固不待言男子勞動而散泄婦人則靜而常佚至春夏以及長夏濕得暑氣之蒸上騰有如蒸飯婦人值經水之適來血海空虛虛則善受且終日坐於濕地而勤女紅土得人氣而漸干濕隨入氣而內入即金匱胞門傷寒之義更有甚者長夏乾土得雨之後則土中之蟲無不蠕動一聞血腥之氣蟲頭上仰噓吸其氣蟲為陰類血為陰汁以陰從陰毒氣並之即為陰挺之病根推而言之即不坐濕地凡婦人不用便桶蹲於廁中而便溺廁中為汙穢幽隱之處更多濕蟲之潛伏其毒氣皆能隨其腥血之氣而上乘之也余家山中每見小兒坐於濕地多患陰莖腫脹或作痛癢俗謂蚯蚓吹也治者揭開鴨嘴含之以鴨喜食蚓也或以花椒白礬湯洗之以椒能勝寒礬能除濕也知此而陰挺之病根更瞭如指掌矣醫者不察其由止按成方以施治無怪病日增劇更有一種漁利之徒以下水消腫攻毒之峻藥為丸內服又以蟾酥硼砂芒硝麝香雄黃冰片阿魏白砒之類外敷為害更烈余所以不忍默然而坐視也余於此治之初患者以五苓散料加蜀椒黃柏小茴附子沙參川芎紅花之類蜜丸每服四錢一日兩服外以花椒苦參蒼朮槐花煎湯入芒硝熏洗又以飛礬六兩銅緑四錢五味子雄黃各五錢桃仁一兩共為細末煉蜜為丸每重四錢雄黃為衣納入陰中奇效或久而成勞經水不利以溫經湯腎氣丸主之而龜板鱉甲蒺藜之類隨症出入加減亦有愈者筆楮難盡惟於金匱婦人雜病及全部中屬詞此事得其一言一字以啓悟機斷無不治之證矣
