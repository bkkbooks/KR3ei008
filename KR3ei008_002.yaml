body:
  text: 卷二胎前門人問曰金匱妊娠一門夫子之注甚詳恐難為淺學道也此外還有簡易之法賢愚可共曉否曰夫道一而已矣淺者自見其淺深者自見其深也金匱本於靈素後之高明者得金匱之一知半解敷衍成篇如今之舉業家取五經四書題目作臭腐時文文無定體惟不失立言之語氣而合時文之法度斯得矣茲且從俗而言時法王海藏云胎前氣血和平則百病不生若氣旺而熱熱則耗氣血而胎不安當清熱養血為主若起居飲食調攝得宜絶嗜欲安養胎氣雖感別症總以安胎為主又云安胎之法有二如母病以致動胎者但療母則胎自安或胎氣不固或有觸動以致母病者宜安胎則母自愈汪石山云凡胎前總以養血健脾清熱疏氣為主吾鄉稱為女科之最上者父子相傳不外此說而更深一步者趙養葵云胎莖之繫於脾猶鍾之繫於梁也若棟柱不固棟梁亦撓必使腎中和暖然後胎有生氣日長而無隕墜之虞何必定以黃芩白朮哉乃此四節平易近人行道人不可不俯而相就毋取驚俗為也門人問曰夫子引王海藏云熱則耗氣血而胎不安而朱丹溪謂胎前當清熱養血為主以白朮黃芩為安胎之聖藥立論相同而金匱治妊娠開章即以桂枝湯為首方且有大熱之附子湯溫補之膠艾湯不啻南轅北轍之異究竟從仲景乎從海藏丹溪乎曰海藏丹溪之論原從金匱常服之當歸散得來金匱之附子湯膠艾湯又與其本篇養胎之白朮散同義須審婦人平日之體氣偏陰偏陽豐厚羸瘦致病之因寒因熱病形之多寒多熱病情之喜寒喜熱又合之於脈而治之不可執一也門人問曰金匱論妊娠開章以桂枝湯居其首其原文云婦人得平脈陰脈小弱其人渴不能食無寒熱名妊娠桂枝湯主之於法六十日當有此症設有醫治逆者卻一月加吐下者則絶之各家所注非失之淺則失之鑿請一一明之以為一隅之舉曰金匱云婦人得平脈者言經水不行不可為無病之人而平脈乃為無病之脈診見此脈有喜出望外之意故曰得也其云陰脈小弱者以陰脈屬下焦尺部視上中二部之脈不過小弱小弱則非等於澀為血滯之病脈此即內經所謂婦人有孕身有病而無邪脈之旨也其云渴不能食者以婦人所食穀味化為血氣下為月水今月水乍聚而欲成胎則中焦之氣壅塞中焦者胃也胃病則懶於納穀故不能食胃病則燥氣偏勝故口乾而渴也其云無寒熱者症自內起不關外邪安有惡寒發熱之象哉故以渴不能食無寒熱七字為妊娠之確切真語也且云於法六十日當有此症者特為陰脈小弱一句自明其師古而不泥古之意內經云陰搏陽別謂之有子言陰尺脈旺與陽寸迥別難經云按之不絶者有孕也亦言按陰尺而不絶也今云陰脈小弱何以與前聖後賢相反至此而不知妊娠之初月水乍聚一月為腜二月為胚三月為胎今在六十日之內其胎尚在將成未成之間下焦之血運於中焦而護腜胚則下焦轉虛所以見小弱之脈過此胎成則漸見陰搏與按之不絶之脈矣其云醫治逆者四句言妊娠只有六十日以三月成胎之數計之卻少了一個月其形不過為一團結聚之血豈容藥之稍誤若誤藥而加吐下則禍不旋踵矣絶之者明告其故更以周易勿藥之說導之也其用桂枝湯奈何蓋以身有病而脈無故又非寒熱邪氣凡一切溫涼補瀉之劑皆未盡善惟有桂枝湯一方調和陰陽之為得也門人問曰巢元方謂妊娠一月名始形足厥陰脈養之二月名始膏足少陽脈養之三月始胎手心主脈以養之當此時血不流行形象始化四月始受水精以成血脈手少陽脈養之五月始受火精以成氣足太陰脈養之六月始受金精以成筋足陽明脈養之七月始受木精以成骨手太陰脈養之八月始受土精以成膚革手陽明脈養之九月始受石精以成毛髮足少陰脈養之十月五臟六腑關節人形皆備陳良甫宗其說以五行分配四時徐之才以十月分配某月見某症則用某藥各家之說當從否乎曰十月分經養胎之說創自隋之巢氏張子和既斥其謬矣須知婦人自受胎以後十二經氣血俱翕聚以養胎元豈有某經養某月胎之理又豈有限於某月必見某症必用某方施治之理齊東野人之語吾輩切勿述之以汙口門人問曰時醫相傳口訣謂胎前無寒吾鄉女科俱宗此說然其說與丹溪輩吻合者多而求之金匱則大不然矣金匱云婦人懷孕六七月脈弦發熱其胎愈脹腹痛惡寒者少腹如扇所以然者子臟開故也當以附子湯溫其臟仲景安胎用附子湯大有取義今人置而勿用豈古法不堪為今用歟曰醫之所貴者力學之外得明師益友日舉其所治之症與聖經之異同合而講論始知其妙其云婦人懷孕六七月其六七月之前身無大病可知也今診其脈弦弦為陰象其身發熱熱為陽浮其胎愈脹脹為虛寒何以謂之曰愈愈者更加之意也吾於此一字而知此婦人本臟素屬虛寒者常有微脹今因病而增脹故曰愈也且可因此一字而定其脈弦為陰盛於內發熱為陽格於外也且人之一身以背與腹分其陰陽也背為陽而頭項該括其中腹為陰而大小腹該括其中今痛而惡寒不在陽部之背與頭項而在陰部之腹大腹在臍上之中脘下脘乃太陰坤土陽明中土所屬也小腹在於臍下乃少陰水臟膀胱水腑之所屬也小腹兩旁名為少腹乃厥陰肝臟胞中血海之所居也今云小腹如扇者實指子臟虛寒不能司閉藏之令故陰中寒氣習習如扇也附子湯方金匱闕之其為傷寒論少陰篇之附子湯無疑張氏醫通云世人皆以附子為墮胎百藥長仲景獨以為安胎之聖藥若非神而明之莫敢輕試也門人問曰妊娠二三月心煩惡食嘔吐等症醫名惡阻得胎後腹常痛醫名胞阻但惡阻症金匱無其名而胞阻則有之但阻者阻隔之義隔者宜通保胎豈得用通之法乎不然何以謂之阻乎曰金匱雖無惡阻之名而第一節云其人渴不能食無寒熱名妊娠桂枝湯主之一本渴字作嘔字注家謂為惡阻産寶謂為子病是也嘔吐不止者金匱用半夏人參丸主胃有寒飲若胃熱上行而嘔吐千金於此方以生薑易乾薑加茯苓麥冬重加鮮竹茹作湯甚效方中取半夏味辛降逆辛則性烈以直通其阻隔樓全善薛立齊皆謂為治惡阻之良方高鼓峰謂與參術同用不獨於胎無礙而且大有健脾安胎之功余每用六君子湯輒效至於胞阻金匱則與漏下俗名漱經半産四五月墮胎謂之半産半産後下血不絶傷其血海妊娠因症而下血金匱用桂枝茯苓丸下其症而安其胎合而並論蓋以胞阻與各症皆為衝任二脈之所司病異而源同也且夫妊娠之胎氣原由陽精內成與陰血外養之者也今陰血之自結與胎阻隔而不相和陰結陰位所以腹中作痛書云通則不痛通之即所以安之惟膠艾湯絲絲入扣且胞阻所云與漏下等症皆陰陽失於抱負坤土失於隄防所致金匱制此方以統治各病微乎微乎方中芎歸宜通其陽血芍地宜通其陰血又得阿膠血肉之品同類相從以養之皆令陰陽之抱負也甘草緩中解急又得艾葉溫暖子宮補火而生土者以助之皆令坤土之隄防也故為調經止漏安胎養血之良方又問金匱云婦人腹中㽲痛當歸芍藥散主之亦是胞阻與否曰㽲痛者微痛而綿綿也乃脾虛反受水凌郁欲求伸而不得故綿綿作痛宜當歸芍藥散兼滲其濕與胞阻之治不同門人問曰金匱云婦人妊娠宜當歸散主之此以涼補為安胎法也又云妊娠養胎白朮散主之此以溫補為安胎法也今皆宗丹溪黃芩白朮為安胎之聖藥之說是白朮散用蜀椒之法可以永廢矣夫子以為何如曰二方皆主白朮謂白朮為安胎之聖藥則可又合黃芩以並言則未免為一偏之言耳凡瘦人多火火盛則耗血而傷胎宜用當歸散肥白人外盛內虛虛則生寒而胎不長宜用白朮散余內子每得胎三月必墜遵丹溪法用藥連墜五次後余赴省應試內子胎適三個月漏紅欲墜先慈延族伯字延義以四物湯加鹿角膠補骨脂杜仲續斷各二錢一服而安令每旬一次余歸已六個月矣閲其方大為一駭嘆曰補骨脂本草載其墜胎又合鹿角膠杜仲之溫芎藭之行以助之竟能如此之效設余在家勢必力爭又以黃芩白朮墜之矣此後凡遇胎漏欲墜之症不敢專主涼血而半産應期而墜者專主大衰論治扁鵲謂命門為男子藏精女子系胞之所胎孕繫於命門命門之火即是元氣以此養胎故有日長之勢譬如果實生於春而結於夏若春夏忽作非時之寒氣涼風則果實亦因之以黃隕矣惟用大補大溫之劑令子宮常得暖氣則胎自日長而有成若非慣患半産不必小題大做凡得胎後預服扶胎之藥以防漏墜只用平補之法余新定所以載丸最驗門人問曰夫子前刻三字經引徐忠可謂金匱妊娠篇凡十方而丸散居七湯居三蓋以湯者蕩也妊娠當以安胎為主則攻補皆宜緩不宜峻故也但十方間有未録音未知其故曰古人識見百倍於今人凡未悉其所以然之妙者恐針鋒不能相對貽誤後人故姑闕之且當歸散白朮散二方余亦罕用也門人問曰海藏以四物等分隨所患之症加入二味名六合湯驅病而無損於胎且亦簡便可從夫子何不全録之以為法乎曰四物湯為婦科之總方海藏取之以護胎胎得所護則寒熱攻補之峻劑俱在胎外以除病而胎元則晏然不知此法甚巧而可從但傷寒宜按六經而加之雜病宜取按各病之主藥而加之難以預定為何藥且海藏表實方加麻黃細辛尚無大誤而表虛方加防風蒼朮則失之遠矣何不云一合麻黃湯一合桂枝湯之為得乎吾更推其意而論正之子滿者孕婦忽見通身腫滿是胎中挾水水與血相搏前方加白朮陳皮茯苓澤瀉子氣者病在氣而不在水氣滯而足面腫喘悶煩食甚則腳指出黃水前方去地黃加香附紫蘇陳皮天仙藤炙甘草金匱葵子茯苓散慎勿輕用子懸者何柏齊謂為濁氣舉胎上湊也胎熱氣逆心胃脹滿前方去地黃加紫蘇陳皮大腹皮人參甘草生薑子煩者心中懊憹口燥心煩前方加麥冬知母竹葉人參甘草子淋者孕婦小便澀少乃肺燥而天氣不降前方加天門冬以清之腎燥而地氣不升前方加細辛以潤之佐木通茯苓以通其便人參甘草以補其虛即本草安榮散之義而金匱云妊娠小便難飲食如故以當歸貝母苦參丸主之大意以肺之治節行於膀胱則熱邪之氣除而淋瀝自止而轉胞症又與子淋便難二症分別或因稟受弱者或因憂鬱傷脾者或因性急傷肝者或因忍小便所致者大抵胎下而壓胞胞系了戾不通其狀小腹急痛不得小便甚者至死必令胎能舉起懸在中央胞系得疏水道自行前方加參朮陳半升麻生薑空心服之或服藥後以手探吐吐後又服之又金匱云但利小便則愈宜腎氣丸主之意者胞之所以正者胞之前後左右皆大氣充滿扶之使正此方大補腎中之氣所以神效子嗽者懷孕咳嗽由於火盛剋金前方加桑白皮天門冬紫苑竹茹甘草子癇者懷孕卒倒無知目吊口噤角弓反張系肝風內動火勢乘風而迅發前方加羚羊角鉤藤竹瀝貝母殭蠶甚者間服風引湯繼以竹葉石膏湯雞子黃連湯以急救之子鳴者妊娠腹內兒有哭聲乃臍下疙瘩兒含口中因孕婦登高舉臂脫出兒口以作此聲前方加茯苓白朮仍散錢於地令其由腰拾之一二刻間疙瘩入兒口其鳴即止子喑者妊娠八九月間忽然不語蓋胎繫於腎腎脈榮舌本今因胎氣壅閉腎脈阻塞應靜候其分娩後則自愈或用前方加茯苓遠志一二服亦可凡此之類言之不盡學者以意通之可也門人問曰婦人妊娠之脈何如曰內經及後賢論脈皆繁而難學惟普明子簡便可從普明子云經云婦人有孕者身有病而無邪脈也有病謂經閉無邪脈謂脈息如常不斷絶也經又云手少陰脈動甚者孕子也少陰心也心主血脈心脈旺則血旺而為孕子之兆經又云陰搏陽別謂之有子言二尺脈旺與兩寸迥別亦為有孕以上三者但得其一即為孕脈分而占之合而推之而孕脈無遁情矣或為流利雀啄亦為孕脈何也答曰流利者血正旺雀啄者經脈閉塞不行故脈疾而歇至此數月之胎也不知者斷為病脈則令人恥笑或為孕有男女何以脈而知之乎答曰左寸為太陽脈浮大知為男也右寸為太陰脈沉實知為女也若兩寸皆浮大主生二男兩尺皆沉實主生二女凡胎孕弦緊滑利為順沉細微弱為逆也門人問曰妊娠有食忌藥忌當以誰氏為主曰此一定之板法達生篇及婦人良方女科大成濟陰綱目等書皆互相沿習今以普明子所定為主普明子云有孕之後凡忌食之物切宜戒食一食雞子糯米令子生寸白蟲一食羊肝令子多疾一食鯉魚令子成疳一食犬肉令子無聲一食兔肉令子缺唇一食鱉肉令子項短一食鴨子令子心寒一食螃蟹多致橫生一食雀肉令子多淫一食豆醬令子發哮一食野獸肉令子多怪疾一食生薑令子多指一食水雞鱔魚令子生癩一食騾馬肉延月難生如此之類無不驗者所當深戒又云娠孕藥忌歌凡數十種推之尚不止此然藥中如斑蝥水蛭蛇蛻蜈蚣水銀信砒等藥皆非恆用之品姑不論茲特選其易犯者約纂數語俾醫者舉筆存神免致差誤其他怪異峻險之品有在孕時自應避忌不待言也歌曰烏頭附子與天雄牛黃巴豆並桃仁芒硝大黃牡丹桂牛膝藜蘆茅茜根槐角紅花與皂角三稜莪朮薏苡仁乾漆䕡茹瞿麥穗半夏南星通草同乾薑大蒜馬刀豆延胡常山麝莫聞此係婦人胎前忌常須記念在心胸長孫心典按上藥忌犯似矣然安胎止嘔有用半夏者娠孕熱病有用大黃者娠孕中寒有用乾薑桂附者是何說也昔黃帝問於岐伯曰婦人重身毒之何如岐伯對曰有故無殞亦無殞也大積大聚其可犯也衰其大半而止有故者謂有病無殞者無殞乎胎也亦無殞者於産母亦無殞也蓋有病則病當之故毒藥無損乎胎氣然大積大聚病勢堅強乃可以投之又須得半而止不宜過劑則慎之又慎矣用藥者可不按岐黃之大法耶門人問曰臨産將護及救治之法何如曰達生篇一書發揮詳盡一字一珠不必再贅凡男人遇本婦懷孕宜執此書日與講論三四頁不過半月也可令全書熟記較日夜與之博奕或閒談消遣孰得孰失請一再思之余又於達生篇所未及者補之凡驗産法腰痛腹不痛者未産腹痛腰不痛者未産必腰腹齊痛甚緊時此真欲産也如遇遲滯以藥投之則得矣蓋天之生人原造化自然之妙不用人力之造作但順其性之自然而已次男元犀按凡新産之婦其臟氣堅固胞胎緊實産前宜服保生無憂散二三劑撐開道路則易生此方於漿水未行時服之若漿水既行遲滯不産勞倦神疲宜十全大補湯以助其力且恐漿水太過血傷而胎不靈活急宜當歸補血湯或加肉桂或加附子隨宜此高鼓峰之心法余屢用屢效或交骨不開或陰門不閉子宮不收三者皆元氣不足交骨不開者前人傳有加味歸芎湯張石頑立論詆之謂每見服此惡血凝滯反成不救惟大劑人參童便入芎歸劑中助其氣血立效陰門不閉者十全大補湯倍參桂補而斂之子宮不收者補中益氣湯加酒芍一錢肉桂五分補而舉之其實張石頑之論亦未免矯枉過正即如加味芎歸湯謂為力量不大則可謂為留血增病則不可至於前人所傳試驗之丸催生有華他順生丹如神散胞衣不下有失笑散花蕊石散業是道者不可不備又難産灸産婦右足小趾尖艾炷如小豆大三五炷立産不可不預講其法金匱方八首時方九首桂枝湯金匱妊娠胎前第一方尤在涇云脈無故而身有病而又無寒熱邪氣則無可施治惟有桂枝湯調和陰陽而已矣徐忠可云桂枝湯外症得之為解肌和榮內症得之為化氣調陰陽也今妊娠初得上下本無病因子宮有凝氣溢上下故但以芍藥一味固其陰氣使不得上溢以桂甘薑棗扶上焦之陽而和其胃氣但令上焦之陽氣充能御相侵之陰氣足矣未嘗治病正所以治病也否則以渴為邪熱以解之以不能食為脾不健而燥之豈不謬哉桂枝茯苓丸治婦人宿有症病成胎後三月而得漏下又三月應期而下而無前後參差且動在臍上不在臍下可以定其為胎有胎而仍漏下者以舊血未去則新血不能入胞養胎而下走不止此方先下其症即是安胎法桂枝茯苓丹皮桃仁去皮尖芍藥各等分上五味研末煉蜜糊丸如兔屎大每日食前服一丸不瘥加至三丸歌曰症痼未除恐害胎胎動手臍下為欲落動於臍上是每月湊集之血症痼之氣妨害之而下漏也胎安症去悟新栽桂苓丹芍桃同等氣血陰陽本末該次孫心蘭稟按桂枝芍藥一陽一陰茯苓丹皮一氣一血合之桃仁逐舊而不傷新為丸緩服所以為佳附子湯方見傷寒論膠艾湯金匱云婦人有漏下者有半産後因續下血不絶者有妊娠下血者假令妊娠腹中痛為胞阻膠艾湯主之乾地黃六兩川芎阿膠甘草各二兩艾葉當歸各三兩芍藥四兩上七味以水五升清酒三升合煮取三升去滓內膠令消盡溫服一升日三服不瘥更作歌曰妊娠腹痛阻胎胞名曰胞阻以胞中之氣血虛寒而阻其化育也二兩芎藭草與膠歸艾各三芍四兩地黃六兩去枝梢次男元犀按芎歸芍地補血之藥也然血不自生生於陽明之水穀故以甘草補之阿膠滋血海為胎産百病之要藥艾葉暖子宮為調經安胎之專品合之為厥陰少陰陽明及沖任兼治之神劑也後人去甘草阿膠艾葉名為四物湯則板實而不靈矣此解與本論中所解互異學者當與所以異處而悟其所以同則知聖方如神龍變化不可方物也當歸芍藥散當歸川芍各三兩芍藥一斤茯苓白朮各四兩澤瀉半斤上六味杵為散取方寸匕酒和日三服歌曰妊娠㽲痛勢綿綿不若寒熱之絞痛血氣之刺痛之三兩芎歸潤且宣芍藥一斤澤減半術苓四兩妙盤旋次男元犀按懷妊腹痛多屬血虛而血生於中氣中者土也土燥不生物故以歸芎芍滋之土濕亦不生物故以苓朮澤瀉滲之燥濕得宜則中氣治而血自生其痛自止當歸貝母苦參丸當歸貝母苦參各四兩上三味末之煉蜜為丸如小豆大飲服三丸加至十丸歌曰飲食如常小水難妊娠鬱熱液因干苦參四兩同歸貝飲服三丸至十丸男子加滑石五錢次男元犀按苦參當歸補心血而清心火貝母開肺鬱而瀉肺火然心火不降則小便短澀肺氣不行於膀胱則水道不通此方為下病上取之法也況貝母主淋漓邪氣神農本草有明文哉當歸散當歸黃芩芍藥川芎各一斤白朮半斤上五味杵為散酒服方寸匕日再服妊娠常服即易産胎無疾苦産後百病悉主之歌曰萬物原來自土生妊娠常服之劑當以補脾陰為主土中涵濕遂生生不窮一斤芎芍歸滋血血為濕化胎尤賴之八兩術一斤芩術本脾藥今作血藥而入脾土則土得濕氣而生物又有黃芩之苦寒清脾以主之肺氣利則血不滯所以生物不息大化成白朮散白朮川芎蜀椒三分去汗牡蠣上四味杵為散酒服三錢匕日三服夜一服但苦痛加芍藥心下毒痛倍加芎藭心煩吐痛不能飲食加細辛一兩半夏大者二十枚服之後更以醋漿水服之若嘔以醋漿水服之復不解者小麥汁服之已後渴者大麥粥服之病雖愈服之勿置歌曰胎由土載木之功血養相資妙有窮土以載之血以養之陰氣上凌椒攝下胎忌陰氣上逆蜀椒具純陽之性陽以陰為家故能使上焦之熱而下降蠣潛龍性得真銓牡蠣水氣所結味鹹性寒寒以制熱燎原咸以導龍入海此方舊本三物各三分牡蠣闕之徐靈胎云原本無分兩加減歌曰苦痛芍藥加最美心下毒痛倚芎是吐痛不食心又煩加夏草枚一細使醋漿水須服後吞若還不嘔藥可止不解者以小麥煮汁嘗以後渴者大麥粥喜既愈常服勿輕拋壺中陰陽大燮理程云來云以大麥粥能調中補脾故服之勿置非指上藥可常服也此解亦超方義已詳歌中不再釋新定所以載丸治胎氣不安不長婦人半産或三月或五月按期不移者必終身不能大産惟此丸可以治之白朮一斤去皮放糯米上蒸半炷香久勿泄氣曬乾研為末人參八兩焙為末桑寄生六兩以自收者為真不見銅鐵為末雲茯苓六兩生研為末川杜仲八兩炒去絲為末以大棗一斤擘開以長流水熬汁迭丸如梧桐子大曬乾退火氣密貯勿令泄氣每早晚各三錢以米湯送下按白朮為補土之正藥土為萬物之母而載萬物故本方取之為君茯苓感蒼松之氣而生苗不出土獨得土氣之全而暗長桑寄生感桑精之氣而生根不入土自具土性之足而敷榮一者伏於土中儼若子居母腹一者寄於枝上居然胎系母胞二物奪天地造化之神功故能資養氣血於無形之處而取效倍於他藥也杜仲補先天之水火而其多絲尤能系維而不墜人參具三才之位育而其多液尤能涵養以成功今年甲子四百一十四甲子矣此方從讀書頗多臨症頗熟悟出蓋自唐宋以後著女科書之前輩不下數百人未聞有一人道及於此今特為補論大為快事神驗保生無憂散婦人臨産先服一二劑自然易生或遇橫生倒産甚至連日不生速服一二劑應手取效可救孕婦産難之災常保母子安全之吉當歸酒洗一錢五分川貝母一錢黃耆荊芥穗各八分厚朴薑汁炒艾葉各七分菟絲子一錢四分川芎一錢三分羌活五分枳殼麩炒六分甘草六分白芍酒洗炒一錢二分冬月用一錢水二鍾姜三片煎至八分空腹溫服普明子曰此方流傳海內用者無不響應而制方之妙人皆不得其解是故疑信相半余因解之新孕婦人胎氣完固腹皮緊窄氣血裹其胞胎最難轉動此方用撐法焉當歸川芎白芍養血活血也厚朴去瘀血者也用之撐開血脈俾惡露不致填塞羌活荊芥疏通太陽將背後一撐太陽經脈最長太陽治而諸經皆治枳殼疏里結氣將面前一撐俾胎氣血抑而無阻滯之虞艾穗撐動子宮則胞胎靈動川貝菟絲最能運胎順産將胎氣全體一撐大具天然活潑之趣矣加黃耆者所以撐扶元氣元氣旺則轉動有力也生薑通神明去穢惡散寒止嘔所以撐扶正氣而安胃氣甘草協和諸藥俾其左宜右有而全其撐法之神者也此真無上良方而今人不知所用即用之而不知制方之妙則亦惘惘然矣余故備言之以醒學者華他顧生丹硃砂五錢研細水飛明乳香一兩箬上炙乾上為末端午日豬心血為丸如芡實大每服一丸用當歸三錢川芎二錢煎湯送下不經女人手催生如神丹治逆産橫生其功甚大百草霜白芷不見火為末各等分上每服三錢以童便米醋和如膏加沸湯調之或用酒煎加入童便少許熱服書云血見黑則止此藥不但順生大能固血又免血枯之妙加味芎歸湯當歸五錢自敗龜板童便炙酥川芎各三錢婦人頭髮一握燒灰存性水煎服約人行五里許即生設是死胎亦下灼過龜板亦可用次男元犀按陰虛而交骨不開用此陽虛而交骨不閉用當歸補血湯加桂附又以熱童便一半調之此一陰一陽之對子也何張石頑過詆之當歸補血湯當歸二錢黃耆一兩長孫心典稟按胎猶舟也血猶水也水漲則舟浮血乾則胎滯其彰明較著也若漿水既行行之過多而不産恐十全八珍之功緩而不及惟此湯黃耆五倍於當歸借氣藥以生其血氣行迅速而血即相隨而胎遂得血而順下矣然猶恐素體虛弱必加附子之走而不守以助藥力勿疑附子之過於辛熱而少用也高鼓峰謂一切難産症於補血大劑之中再加肉桂二三錢堪云神驗失笑散治瘀血脹胞並治兒枕痛神效蒲黃炒五靈脂去土炒各等分共為末醋糊丸如桐子大每服二三錢淡醋水下花蕊石散治産後敗血不盡血迷血暈胎衣不下脹急不省人事但心頭溫者急用一服灌下瘀血化水而出其人即蘇效驗如神醫家不可缺此花蕊石一斤土色硫黃四兩上為末和勻先用紙泥封固瓦罐一個入二藥仍用紙泥封口曬乾用炭煅二炷香次日取出研細每服一錢童便和熱酒調下甚者用二三錢牛膝散治胎衣不下腹中脹急以此藥腐化而下緩則不救牛膝川芎蒲黃炒丹皮各二兩桂心四錢當歸一兩五錢共為末每服五錢水煎服又婦人服藥勿犯三大忌一曰麥蘖一曰牛膝一曰木耳又頭蠶子亦然余於胎前諄諄囑其勿犯業醫者當知所戒矣
